            container.scrollTop = Math.max(0, targetScrollTop);

            // 가상 스크롤이 활성화된 경우, 해당 위치의 행들을 직접 렌더링
            if (virtualScroll.enabled) {
                const visibleRows = Math.ceil(clientHeight / virtualScroll.rowHeight) || 30;
                const startIndex = Math.max(0, index - Math.floor(visibleRows / 2) - virtualScroll.bufferSize);
                const endIndex = Math.min(filteredLogs.length, startIndex + visibleRows + virtualScroll.bufferSize * 2);

                virtualScroll.visibleStart = startIndex;
                virtualScroll.visibleEnd = endIndex;
                renderVisibleRowsWithPool(filteredLogs, startIndex, endIndex);
            }
        }

        // 맨 아래로 스크롤 및 렌더링
        function scrollToBottom() {
            const container = document.querySelector('.log-table-container');
            if (!container || !filteredLogs || filteredLogs.length === 0) return;

            const lastIndex = filteredLogs.length - 1;
            const clientHeight = container.clientHeight;
            const visibleRows = Math.ceil(clientHeight / virtualScroll.rowHeight) || 30;

            // 맨 아래로 스크롤
            container.scrollTop = lastIndex * virtualScroll.rowHeight;

            // 가상 스크롤이 활성화된 경우, 마지막 부분 렌더링
            if (virtualScroll.enabled) {
                const startIndex = Math.max(0, filteredLogs.length - visibleRows - virtualScroll.bufferSize);
                const endIndex = filteredLogs.length;

                virtualScroll.visibleStart = startIndex;
                virtualScroll.visibleEnd = endIndex;
                renderVisibleRowsWithPool(filteredLogs, startIndex, endIndex);
            }
        }

        function applyFilter() {
            // 필터 캐시 무효화 및 새로 생성
            invalidateFilterCache();
            const filterState = getCachedFilterState();

            // 자동스크롤 상태 캡처 (renderLogs 후 변경되기 전에)
            const wasAutoScroll = autoScroll;

            // 자동 스크롤이 꺼져 있을 때만 위치 유지
            // 자동 스크롤이 켜져 있으면 맨 아래로 스크롤
            const shouldPreservePosition = !wasAutoScroll;
            const centerLine = shouldPreservePosition ? getCurrentCenterLogLine() : null;

            // 필터링 수행 (캐시된 상태 사용)
            filteredLogs = allLogs.filter(log => passesFilter(log, filterState));

            // 작은 데이터셋은 동기 처리
            if (filteredLogs.length < 1000) {
                highlightedIndices = [];
                filteredLogs.forEach((log, index) => {
                    log.isHighlighted = checkHighlight(log, filterState);
                    if (log.isHighlighted) {
                        highlightedIndices.push(index);
                    }
                });
                updateHighlightCount();
                renderLogs(filteredLogs);
                updateIndicator(filteredLogs);
                updateLogCount();

                // 필터 후 위치 복원
                if (centerLine !== null && filteredLogs.length > 0) {
                    const newIndex = findNearestLogIndex(filteredLogs, centerLine);
                    scrollToCenter(newIndex);
                } else if (wasAutoScroll && filteredLogs.length > 0) {
                    // 자동스크롤 ON이었으면 맨 아래로
                    scrollToBottom();
                    autoScroll = true;  // 상태 복원
                }
                return;
            }

            // 대용량 데이터: viewport 중심 청크 처리
            applyFilterAsync(filterState, centerLine);
        }

        // 비동기 필터 처리 (viewport 중심, 청크 단위)
        function applyFilterAsync(filterState, centerLine = null) {
            const jobId = ++filterJobId;
            const logs = filteredLogs;
            const total = logs.length;
            const chunkSize = 500;

            // 자동스크롤 상태 캡처 (renderLogs 후 스크롤 핸들러가 변경하기 전에)
            const wasAutoScroll = autoScroll;

            // 이전 위치 기반으로 새로운 viewport 중심 계산
            // autoScroll이 켜져 있으면 (centerLine === null) 맨 아래 기준
            let viewportCenter;
            if (centerLine !== null && total > 0) {
                viewportCenter = findNearestLogIndex(logs, centerLine);
            } else if (wasAutoScroll && total > 0) {
                viewportCenter = total - 1;  // 맨 아래
            } else {
                const container = document.querySelector('.log-table-container');
                const currentScrollTop = container ? container.scrollTop : 0;
                const centerIndex = Math.floor(currentScrollTop / virtualScroll.rowHeight);
                viewportCenter = Math.min(Math.max(0, centerIndex), total - 1);
            }

            // 하이라이트 초기화
            highlightedIndices = [];
            logs.forEach(log => log.isHighlighted = false);

            // 우선순위 큐: viewport 근처부터 처리
            const chunks = [];
            let left = viewportCenter, right = viewportCenter;

            while (left >= 0 || right < total) {
                // viewport 중심에서 양방향으로 확장
                if (left >= 0) {
                    const start = Math.max(0, left - chunkSize + 1);
                    chunks.push({ start, end: left + 1 });
                    left = start - 1;
                }
                if (right < total) {
                    const end = Math.min(total, right + chunkSize);
                    if (right > viewportCenter || left < 0) {  // 중복 방지
                        chunks.push({ start: right, end });
                    }
                    right = end;
                }
            }

            let processedChunks = 0;
            const totalChunks = chunks.length;

            // 즉시 렌더링 (하이라이트 없이)
            renderLogs(logs);
            updateLogCount();
            setStatus(`필터링 중... 0/${total}`);

            // 필터 후 위치 복원
            if (centerLine !== null && total > 0) {
                scrollToCenter(viewportCenter);
            } else if (wasAutoScroll && total > 0) {
                scrollToBottom();
                autoScroll = true;  // 자동스크롤 상태 복원
            }

            // 청크 단위 비동기 처리
            function processNextChunk() {
                if (jobId !== filterJobId) return;  // 새 작업이 시작됨
                if (processedChunks >= totalChunks) {
                    // 완료
                    updateHighlightCount();
                    updateIndicator(logs);
                    setStatus(`필터링 완료: ${highlightedIndices.length}개 하이라이트`);

                    // 현재 보이는 영역 다시 렌더링 (하이라이트 적용)
                    const visibleStart = virtualScroll.visibleStart;
                    const visibleEnd = virtualScroll.visibleEnd;
                    renderVisibleRowsWithPool(logs, visibleStart, visibleEnd);
                    return;
                }

                const chunk = chunks[processedChunks];
                for (let i = chunk.start; i < chunk.end; i++) {
                    const log = logs[i];
                    log.isHighlighted = checkHighlight(log, filterState);
                    if (log.isHighlighted) {
                        highlightedIndices.push(i);
                    }
                }

                processedChunks++;
                const processed = Math.min(processedChunks * chunkSize, total);

                // 진행 상황 업데이트 (5청크마다)
                if (processedChunks % 5 === 0 || processedChunks === totalChunks) {
                    setStatus(`필터링 중... ${processed}/${total}`);
                    updateHighlightCount();
                }

                // 첫 번째 청크 후 현재 보이는 영역 즉시 업데이트
                if (processedChunks === 1) {
                    const visibleStart = virtualScroll.visibleStart;
                    const visibleEnd = virtualScroll.visibleEnd;
                    renderVisibleRowsWithPool(logs, visibleStart, visibleEnd);
                }

                // 다음 청크 예약 (requestIdleCallback 또는 setTimeout)
                if (typeof requestIdleCallback !== 'undefined') {
                    requestIdleCallback(() => processNextChunk(), { timeout: 50 });
                } else {
                    setTimeout(processNextChunk, 0);
                }
            }

            // 첫 번째 청크 시작
            processNextChunk();
        }

        // ===== 하이라이트 네비게이션 =====
        function updateHighlightCount() {
            const countEl = document.getElementById('highlight-count');
            if (!countEl) return;

            if (highlightedIndices.length === 0) {
                currentHighlightPos = -1;
                countEl.textContent = '0/0';
            } else {
                if (currentHighlightPos < 0) currentHighlightPos = 0;
                if (currentHighlightPos >= highlightedIndices.length) currentHighlightPos = highlightedIndices.length - 1;
                countEl.textContent = `${currentHighlightPos + 1}/${highlightedIndices.length}`;
            }
        }

        function navigateHighlight(direction) {
            if (highlightedIndices.length === 0) {
                setStatus('하이라이트된 항목이 없습니다');
                return;
            }

            currentHighlightPos += direction;

            if (currentHighlightPos < 0) {
                currentHighlightPos = highlightedIndices.length - 1;
            } else if (currentHighlightPos >= highlightedIndices.length) {
                currentHighlightPos = 0;
            }

            updateHighlightCount();

            const targetIndex = highlightedIndices[currentHighlightPos];
            // 자동 스크롤 OFF
            autoScroll = false;
            updateAutoScrollStatus();
            // 스크롤 후 렌더링 완료되면 행 선택
            scrollToRow(targetIndex, () => selectRow(targetIndex));
        }

        // 스크롤 중 플래그 (연쇄 렌더링 방지)
        let isScrollingToRow = false;

        function scrollToRow(index, callback) {
            const container = document.querySelector('.log-table-container');
            if (!container) return;

            if (virtualScroll.enabled && filteredLogs.length > 0) {
                isScrollingToRow = true;

                // 1. 해당 인덱스가 포함된 렌더링 범위 계산 (인덱스 중심)
                const visibleRows = Math.ceil(container.clientHeight / virtualScroll.rowHeight) || 30;
                const halfVisible = Math.floor(visibleRows / 2);
                const startIndex = Math.max(0, index - halfVisible - virtualScroll.bufferSize);
                const endIndex = Math.min(filteredLogs.length, index + halfVisible + virtualScroll.bufferSize);

                // 2. 가상 스크롤 상태 업데이트
                virtualScroll.visibleStart = startIndex;
                virtualScroll.visibleEnd = endIndex;

                // 3. 해당 범위 렌더링
                renderVisibleRowsWithPool(filteredLogs, startIndex, endIndex);

                // 4. 렌더링 후 해당 행의 실제 위치로 스크롤
                requestAnimationFrame(() => {
                    const targetRow = container.querySelector(`tr[data-index="${index}"]`);
                    if (targetRow) {
                        // 행의 실제 offset 계산
                        const rowTop = targetRow.offsetTop;
                        const rowHeight = targetRow.offsetHeight;
                        const containerHeight = container.clientHeight;

                        // 화면 중앙에 배치되도록 스크롤 위치 계산
                        const targetScrollTop = rowTop - (containerHeight / 2) + (rowHeight / 2);
                        container.scrollTop = Math.max(0, targetScrollTop);

                        // 스크롤 위치 동기화
                        virtualScroll.lastScrollTop = container.scrollTop;
                    }

                    // 플래그 해제 및 콜백 실행
                    requestAnimationFrame(() => {
                        isScrollingToRow = false;
                        if (callback) callback();
                    });
                });
            } else {
                const row = container.querySelector(`tr[data-index="${index}"]`);
                if (row) {
                    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    if (callback) callback();
                }
            }
        }

        function selectRow(index) {
            // 다중 선택 시스템과 연동 (단일 선택)
            selectedLogIndex = index;
            lastSelectedIndex = index;
            selectedLogIndices.clear();
            selectedLogIndices.add(index);
            updateSelectionUI();
        }

        // ===== 렌더링 함수 =====
        function renderLogs(logs) {
            const container = document.querySelector('.log-table-container');
            const tbody = document.querySelector('.log-table tbody');

            // 기존 spacer 제거 (있으면)
            const oldSpacer = container.querySelector('.virtual-scroll-spacer');
            if (oldSpacer) oldSpacer.remove();

            virtualScroll.enabled = logs.length >= virtualScroll.threshold;

            // DOM 풀 초기화 (최초 1회)
            if (!rowPool.initialized) {
                rowPool.init(tbody);
                setupEventDelegation(tbody);
            }

            if (!virtualScroll.enabled) {
                renderAllRowsWithPool(logs, tbody);
                return;
            }

            const containerHeight = container.clientHeight;
            const visibleRows = Math.ceil(containerHeight / virtualScroll.rowHeight) || 30;

            virtualScroll.visibleStart = 0;
            virtualScroll.visibleEnd = Math.min(visibleRows + virtualScroll.bufferSize * 2, logs.length);
            renderVisibleRowsWithPool(logs, 0, virtualScroll.visibleEnd);

            // 스크롤 핸들러 - requestAnimationFrame 기반
            // scrollThreshold를 사용하여 연쇄 스크롤 방지
            let pendingRender = false;
            virtualScroll.lastScrollTop = container.scrollTop;

            container.onscroll = () => {
                // scrollToRow 진행 중이면 재렌더링 스킵 (연쇄 스크롤 방지)
                if (isScrollingToRow) return;

                // 자동 스크롤 상태 업데이트 (항상 즉시 처리)
                const scrollTop = container.scrollTop;
                const scrollHeight = container.scrollHeight;
                const clientHeight = container.clientHeight;
                const isNearBottom = scrollHeight - scrollTop - clientHeight < 50;

                autoScroll = isNearBottom;
                updateAutoScrollStatus();

                if (!virtualScroll.enabled) return;

                // 스크롤 변화량 확인 - 임계값 미만이면 무시 (연쇄 스크롤 방지)
                const scrollDelta = Math.abs(scrollTop - virtualScroll.lastScrollTop);
                if (scrollDelta < virtualScroll.scrollThreshold && !pendingRender) {
                    // 임계값 미만이지만, 경계 근처인지 확인
                    const currentVisibleRows = Math.ceil(clientHeight / virtualScroll.rowHeight) || 30;
                    const startIndex = Math.max(0, Math.floor(scrollTop / virtualScroll.rowHeight) - virtualScroll.bufferSize);
                    const endIndex = Math.min(filteredLogs.length, startIndex + currentVisibleRows + virtualScroll.bufferSize * 2);

                    // 뷰포트가 버퍼를 벗어나지 않았으면 재렌더링 스킵
                    if (startIndex >= virtualScroll.visibleStart && endIndex <= virtualScroll.visibleEnd) {
                        return;
                    }
                }

                // 다음 프레임에 렌더링 예약 (중복 방지)
                if (!pendingRender) {
                    pendingRender = true;
                    requestAnimationFrame(() => {
                        pendingRender = false;

                        // 현재(최신) 스크롤 위치 사용
                        const currentScrollTop = container.scrollTop;
                        const currentClientHeight = container.clientHeight;

                        // 항상 최신 filteredLogs 사용 (스트리밍 중 새 로그 반영)
                        const currentLogs = filteredLogs;
                        const currentVisibleRows = Math.ceil(currentClientHeight / virtualScroll.rowHeight) || 30;
                        const startIndex = Math.max(0, Math.floor(currentScrollTop / virtualScroll.rowHeight) - virtualScroll.bufferSize);
                        const endIndex = Math.min(currentLogs.length, startIndex + currentVisibleRows + virtualScroll.bufferSize * 2);

                        if (startIndex !== virtualScroll.visibleStart || endIndex !== virtualScroll.visibleEnd) {
                            virtualScroll.visibleStart = startIndex;
                            virtualScroll.visibleEnd = endIndex;
                            virtualScroll.lastScrollTop = currentScrollTop;  // 렌더링 후 위치 저장
                            renderVisibleRowsWithPool(currentLogs, startIndex, endIndex);
                        }
                    });
                }
            };
        }

        // 마우스 Y 좌표로 행 인덱스 계산 (DOM 기반 - 실제 행 높이에 무관)
        function getRowIndexFromMouseY(clientY) {
            const container = document.querySelector('.log-table-container');
            if (!container) return -1;
            const rect = container.getBoundingClientRect();
            // 컨테이너 밖이면 무효
            if (clientY < rect.top || clientY > rect.bottom) return -1;

            // elementsFromPoint로 해당 위치의 실제 행 요소 찾기
            const probeX = rect.left + rect.width * 0.6;
            const elements = document.elementsFromPoint(probeX, clientY);
            for (const el of elements) {
                const row = el.closest('tr[data-index]');
                if (row) {
                    const idx = parseInt(row.dataset.index);
                    return isNaN(idx) ? -1 : idx;
                }
            }
            return -1;
        }

        // 드래그 범위 선택 업데이트
        function updateDragSelection(currentIndex) {
            if (currentIndex < 0) return;
            const start = Math.min(dragStartIndex, currentIndex);
            const end = Math.max(dragStartIndex, currentIndex);

            // 기존 선택(Ctrl+드래그용) 복원 후 드래그 범위 추가
            selectedLogIndices = new Set(dragBaseSelection);
            for (let i = start; i <= end; i++) {
                selectedLogIndices.add(i);
            }
            window.selectedLogIndices = selectedLogIndices;
            updateSelectionUI();
        }

        // Event Delegation 설정 (tbody에 단일 리스너)
        function setupEventDelegation(tbody) {
            // 클릭 - JSON 토글 전용 (선택은 mousedown에서 처리)
            tbody.addEventListener('click', function(e) {
                if (e.target.classList.contains('json-preview') || e.target.classList.contains('json-expanded')) {
                    toggleJsonExpand(e.target);
                }
            });

            // mousedown - 드래그 선택 시작
            tbody.addEventListener('mousedown', function(e) {
                if (e.button !== 0) return;  // 좌클릭만
                const row = e.target.closest('tr[data-index]');
                if (!row) return;
                // JSON 클릭은 선택 시작하지 않음
                if (e.target.classList.contains('json-preview') || e.target.classList.contains('json-expanded')) return;

                const index = parseInt(row.dataset.index);
                if (isNaN(index)) return;

                isDragging = true;
                dragActivated = false;
                dragStartIndex = index;
                dragStartY = e.clientY;
                dragLastIndex = index;

                // Ctrl/Cmd: 기존 선택 유지하면서 추가/토글
                if (e.ctrlKey || e.metaKey) {
                    dragBaseSelection = new Set(selectedLogIndices);
                    if (selectedLogIndices.has(index)) {
                        selectedLogIndices.delete(index);
                        dragBaseSelection.delete(index);
                    } else {
                        selectedLogIndices.add(index);
                        dragBaseSelection.add(index);
                    }
                    dragStartIndex = index;
                } else if (e.shiftKey && lastSelectedIndex >= 0) {
                    // Shift: 범위 선택
                    dragBaseSelection = new Set();
                    const start = Math.min(lastSelectedIndex, index);
                    const end = Math.max(lastSelectedIndex, index);
                    selectedLogIndices.clear();
                    for (let i = start; i <= end; i++) {
                        selectedLogIndices.add(i);
                    }
                    dragStartIndex = lastSelectedIndex;
                    dragBaseSelection = new Set();
                } else {
                    // 일반 클릭: 새로 시작
                    dragBaseSelection = new Set();
                    selectedLogIndices.clear();
                    selectedLogIndices.add(index);
                }

                lastSelectedIndex = index;
                selectedLogIndex = index;
                window.selectedLogIndices = selectedLogIndices;
                updateSelectionUI();

                // 행 선택 시 자동 스크롤 OFF
                autoScroll = false;
                updateAutoScrollStatus();

                // 텍스트 선택 방지
                e.preventDefault();
            });

            // mousemove - 드래그 중 범위 확장 + 자동 스크롤
            document.addEventListener('mousemove', function(e) {
                if (!isDragging) return;

                // 드래그 임계값 체크 - 최소 거리 이동 전에는 드래그 시작하지 않음
                if (!dragActivated) {
                    if (Math.abs(e.clientY - dragStartY) < DRAG_THRESHOLD) return;
                    dragActivated = true;
                    document.querySelector('.log-table-container')?.classList.add('is-dragging');
                }

                const container = document.querySelector('.log-table-container');
                if (!container) return;
                const rect = container.getBoundingClientRect();

                // 현재 마우스 위치의 행 인덱스 계산 (컨테이너 밖이면 -1)
                const currentIndex = getRowIndexFromMouseY(e.clientY);
                if (currentIndex >= 0) {
                    dragLastIndex = currentIndex;
                    updateDragSelection(currentIndex);
                }
                // 컨테이너 밖이면 마지막 유효 인덱스 유지 (갑자기 끝까지 선택 방지)

                // 가장자리 자동 스크롤
                const edgeThreshold = 40;
                const thead = container.querySelector('thead');
                const theadTop = rect.top + (thead ? thead.getBoundingClientRect().height : 0);
                clearInterval(dragAutoScrollTimer);
                dragAutoScrollTimer = null;

                if (e.clientY < theadTop + edgeThreshold && e.clientY >= rect.top) {
                    // 상단 가장자리 - 위로 스크롤
                    const intensity = Math.max(0.3, 1 - (e.clientY - rect.top) / edgeThreshold);
                    dragAutoScrollTimer = setInterval(() => {
                        container.scrollTop -= Math.ceil(intensity * 2) * virtualScroll.rowHeight;
                        const idx = getRowIndexFromMouseY(Math.max(e.clientY, theadTop + 1));
                        if (idx >= 0) {
                            dragLastIndex = idx;
                            updateDragSelection(idx);
                        }
                    }, 80);
                } else if (e.clientY > rect.bottom - edgeThreshold && e.clientY <= rect.bottom) {
                    // 하단 가장자리 - 아래로 스크롤
                    const intensity = Math.max(0.3, 1 - (rect.bottom - e.clientY) / edgeThreshold);
                    dragAutoScrollTimer = setInterval(() => {
                        container.scrollTop += Math.ceil(intensity * 2) * virtualScroll.rowHeight;
                        const idx = getRowIndexFromMouseY(Math.min(e.clientY, rect.bottom - 1));
                        if (idx >= 0) {
                            dragLastIndex = idx;
                            updateDragSelection(idx);
                        }
                    }, 80);
                }
            });

            // mouseup - 드래그 종료
            document.addEventListener('mouseup', function(e) {
                if (!isDragging) return;
                isDragging = false;
                dragActivated = false;
                clearInterval(dragAutoScrollTimer);
                dragAutoScrollTimer = null;
                document.querySelector('.log-table-container')?.classList.remove('is-dragging');

                if (selectedLogIndices.size > 1) {
                    setStatus(`${selectedLogIndices.size}줄 선택됨 (Ctrl+C로 복사)`);
                }
            });

            tbody.addEventListener('dblclick', function(e) {
                const row = e.target.closest('tr[data-index]');
                if (!row) return;

                const index = parseInt(row.dataset.index);
                if (!isNaN(index) && filteredLogs[index]) {
                    const log = filteredLogs[index];
                    log.isBookmarked = !log.isBookmarked;

                    // 해당 행만 업데이트 (전체 재렌더링 없이)
                    updateSingleRow(row, log, index);
                    updateIndicator(filteredLogs);
                }
            });
        }

        // ===== 다중 선택 및 클립보드 복사 =====

        // 선택된 로그를 클립보드에 복사
        function copySelectedLogs() {
            if (selectedLogIndices.size === 0) return;

            // 인덱스 정렬
            const sortedIndices = Array.from(selectedLogIndices).sort((a, b) => a - b);

            // 로그 텍스트 생성
            const logTexts = sortedIndices.map(idx => {
                const log = filteredLogs[idx];
                if (!log) return '';
                return `${log.dateTime} ${log.level.padEnd(5)} [${log.thread}] ${log.class} - ${log.message}`;
            }).filter(t => t);

            const text = logTexts.join('\n');

            // 클립보드에 복사
            navigator.clipboard.writeText(text).then(() => {
                setStatus(`${sortedIndices.length}줄 복사됨`);
            }).catch(err => {
                console.error('클립보드 복사 실패:', err);
                setStatus('클립보드 복사 실패');
            });
        }

        // 전체 선택
        function selectAllLogs() {
            selectedLogIndices.clear();
            for (let i = 0; i < filteredLogs.length; i++) {
                selectedLogIndices.add(i);
            }
            updateSelectionUI();
            setStatus(`전체 ${filteredLogs.length}줄 선택됨 (Ctrl+C로 복사)`);
        }

        // 선택 해제
        function clearSelection() {
            selectedLogIndices.clear();
            lastSelectedIndex = -1;
            selectedLogIndex = -1;
            updateSelectionUI();
        }

        // 선택 UI 업데이트
        function updateSelectionUI() {
            document.querySelectorAll('.log-table tr[data-index]').forEach(row => {
                const idx = parseInt(row.dataset.index);
                if (selectedLogIndices.has(idx)) {
                    row.classList.add('log-row-selected');
                } else {
                    row.classList.remove('log-row-selected');
                }
            });
        }

        // 행 클릭 처리 (다중 선택 지원)
        function handleRowClick(index, event) {
            if (event.shiftKey && lastSelectedIndex >= 0) {
                // Shift+클릭: 범위 선택
                const start = Math.min(lastSelectedIndex, index);
                const end = Math.max(lastSelectedIndex, index);
                if (!event.ctrlKey && !event.metaKey) {
                    selectedLogIndices.clear();
                }
                for (let i = start; i <= end; i++) {
                    selectedLogIndices.add(i);
                }
            } else if (event.ctrlKey || event.metaKey) {
                // Ctrl+클릭: 토글 선택
                if (selectedLogIndices.has(index)) {
                    selectedLogIndices.delete(index);
                } else {
                    selectedLogIndices.add(index);
                }
                lastSelectedIndex = index;
            } else {
                // 일반 클릭: 단일 선택
                selectedLogIndices.clear();
                selectedLogIndices.add(index);
                lastSelectedIndex = index;
            }

            selectedLogIndex = index;  // 레거시 호환
            updateSelectionUI();

            // 선택 카운트 표시
            if (selectedLogIndices.size > 1) {
                setStatus(`${selectedLogIndices.size}줄 선택됨 (Ctrl+C로 복사)`);
            }
        }

        // 단일 행 업데이트 (북마크 토글 등)
        function updateSingleRow(row, log, index) {
            const highlightKeyword = document.getElementById('highlight-enabled')?.checked ?
                document.getElementById('highlight-keyword')?.value || '' : '';

            // 행 클래스 업데이트 (다중 선택 지원)
            row.className = 'border-b border-gray-200 dark:border-gray-700';
            if (selectedLogIndices.has(index)) {
                row.classList.add('log-row-selected');
            } else if (log.isBookmarked) {
                row.classList.add('log-row-bookmark');
            } else if (log.isHighlighted) {
                row.classList.add('log-row-highlight');
            } else if (log.level === 'ERROR' || log.level === 'FATAL') {
                row.classList.add('log-row-error');
            } else if (log.level === 'WARN') {
                row.classList.add('log-row-warn');
            } else {
                row.classList.add('hover:bg-gray-100', 'dark:hover:bg-gray-800');
            }

            // 북마크 셀 업데이트
            const bookmarkCell = row.querySelector('.cell-bookmark');
            if (bookmarkCell) {
                bookmarkCell.textContent = log.isBookmarked ? '★' : '';
            }
        }

        // DOM 풀을 사용한 모든 행 렌더링 (가상 스크롤 비활성화 시)
        function renderAllRowsWithPool(logs, tbody) {
            const highlightKeyword = document.getElementById('highlight-enabled')?.checked ?
                document.getElementById('highlight-keyword')?.value || '' : '';

            rowPool.updatePadding(0, 0);

            const displayCount = Math.min(logs.length, rowPool.poolSize);

            for (let i = 0; i < rowPool.poolSize; i++) {
                if (i < displayCount) {
                    rowPool.updateRow(rowPool.rows[i], logs[i], i, highlightKeyword);
                } else {
                    rowPool.hideRow(rowPool.rows[i]);
                }
            }
        }

        // DOM 풀을 사용한 가시 영역 렌더링 (가상 스크롤)
        function renderVisibleRowsWithPool(logs, startIndex, endIndex) {
            const highlightKeyword = document.getElementById('highlight-enabled')?.checked ?
                document.getElementById('highlight-keyword')?.value || '' : '';

            const topPadding = startIndex * virtualScroll.rowHeight;
            const bottomPadding = Math.max(0, (logs.length - endIndex) * virtualScroll.rowHeight);

            rowPool.updatePadding(topPadding, bottomPadding);

            const visibleCount = endIndex - startIndex;

            for (let i = 0; i < rowPool.poolSize; i++) {
                if (i < visibleCount) {
                    const logIndex = startIndex + i;
                    rowPool.updateRow(rowPool.rows[i], logs[logIndex], logIndex, highlightKeyword);
                } else {
                    rowPool.hideRow(rowPool.rows[i]);
                }
            }
        }

        // 레거시 함수 (하위 호환성)
        function renderAllRows(logs, tbody) {
            const highlightKeyword = document.getElementById('highlight-enabled')?.checked ?
                document.getElementById('highlight-keyword')?.value || '' : '';

            tbody.innerHTML = logs.map((log, index) => renderRow(log, index, highlightKeyword)).join('');
            attachRowEvents();
        }

        function renderVisibleRows(logs, tbody, startIndex, endIndex) {
            const highlightKeyword = document.getElementById('highlight-enabled')?.checked ?
                document.getElementById('highlight-keyword')?.value || '' : '';

            const topPadding = startIndex * virtualScroll.rowHeight;
            const bottomPadding = (logs.length - endIndex) * virtualScroll.rowHeight;

            let html = '';
            if (topPadding > 0) {
                html += `<tr style="height: ${topPadding}px;"><td colspan="6"></td></tr>`;
            }

            for (let i = startIndex; i < endIndex; i++) {
                html += renderRow(logs[i], i, highlightKeyword);
            }

            if (bottomPadding > 0) {
                html += `<tr style="height: ${bottomPadding}px;"><td colspan="6"></td></tr>`;
            }

            tbody.innerHTML = html;
            attachRowEvents();
        }

        function renderRow(log, index, highlightKeyword) {
            let rowClass = 'hover:bg-gray-100 dark:hover:bg-gray-800';
            if (log.isBookmarked) rowClass = 'log-row-bookmark';
            else if (log.isHighlighted) rowClass = 'log-row-highlight';
            else if (log.level === 'ERROR' || log.level === 'FATAL') rowClass = 'log-row-error';
            else if (log.level === 'WARN') rowClass = 'log-row-warn';

            let message = formatMessage(log.message, highlightKeyword);

            return `<tr class="${rowClass} border-b border-gray-200 dark:border-gray-700" data-index="${index}" style="height: ${virtualScroll.rowHeight}px;">
                <td class="w-14 text-right px-2 text-gray-400 dark:text-gray-500 font-mono text-xs">${log.line || ''}</td>
                <td class="w-8 text-center text-yellow-500">${log.isBookmarked ? '★' : ''}</td>
                <td class="w-44 px-1">${log.dateTime}</td>
                <td class="w-14 text-center font-bold level-${log.level}">${log.level}</td>
                <td class="w-36 px-1 text-purple-600 dark:text-purple-400 truncate">${escapeHtml(log.thread)}</td>
                <td class="w-48 px-1 text-green-700 dark:text-green-400 truncate">${escapeHtml(log.class)}</td>
                <td class="min-w-[400px] px-1">${message}</td>
            </tr>`;
        }

        // 메시지 포맷팅 (JSON 감지 및 하이라이트)
        function formatMessage(rawMessage, highlightKeyword, jsonExpanded = false) {
            let message = escapeHtml(rawMessage);

            // JSON 감지 - 간단한 휴리스틱 사용 (정규식 백트래킹 방지)
            // {...} 또는 [...] 패턴을 찾되, 중첩된 구조는 괄호 카운팅으로 처리
            if (rawMessage.includes('{') || rawMessage.includes('[')) {
                const jsonObjects = extractJsonObjects(rawMessage);
                jsonObjects.forEach(jsonStr => {
                    try {
                        const parsed = JSON.parse(jsonStr); // 유효한 JSON인지 확인
                        const escapedJson = escapeHtml(jsonStr);

                        let replacement;
                        if (jsonExpanded) {
                            // 펼쳐진 상태로 렌더링
                            const formatted = JSON.stringify(parsed, null, 2);
                            replacement = `<span class="json-expanded text-blue-600 dark:text-blue-400" data-json="${escapedJson.replace(/"/g, '&quot;')}" title="클릭하여 JSON 축소">${escapeHtml(formatted)}</span>`;
                        } else {
                            // 미리보기 상태로 렌더링
                            const preview = jsonStr.length > 80 ? escapeHtml(jsonStr.substring(0, 80)) + '...' : escapedJson;
                            replacement = `<span class="json-preview text-blue-600 dark:text-blue-400" data-json="${escapedJson.replace(/"/g, '&quot;')}" title="클릭하여 JSON 확장">${preview}</span>`;
                        }
                        message = message.replace(escapedJson, replacement);
                    } catch (e) {
                        // JSON 파싱 실패 - 원본 유지
                    }
                });
            }

            // Word Filter (Find) 매칭 텍스트 컬러링 (녹색)
            const wordFindInput = document.getElementById('word-find');
            const wordFindValue = wordFindInput ? wordFindInput.value.trim() : '';
            if (wordFindValue) {
                const findKeywords = wordFindValue.split('|').map(k => k.trim()).filter(k => k);
                findKeywords.forEach(keyword => {
                    const regex = new RegExp(`(${escapeRegex(keyword)})`, 'gi');
                    message = message.replace(regex, '<span class="word-filter-match">$1</span>');
                });
            }

            // 하이라이트 키워드 적용 (노란색 배경)
            if (highlightKeyword) {
                const keywords = highlightKeyword.split('|').map(k => k.trim()).filter(k => k);
                keywords.forEach(keyword => {
                    const regex = new RegExp(`(${escapeRegex(keyword)})`, 'gi');
                    message = message.replace(regex, '<span class="keyword-match">$1</span>');
                });
            }

            return message;
        }

        function updateIndicator(logs) {
            const leftContainer = document.querySelector('.indicator-left');
            const rightContainer = document.querySelector('.indicator-right');

            if (!leftContainer || !rightContainer) return;

            if (logs.length === 0) {
                leftContainer.innerHTML = '';
                rightContainer.innerHTML = '';
                return;
            }

            const containerHeight = leftContainer.clientHeight || 300;
            const leftHtml = [];
            const rightHtml = [];

            // 성능: 마커 개수 제한 (최대 1000개씩)
            const maxMarkers = 1000;
            let leftCount = 0, rightCount = 0;

            logs.forEach((log, index) => {
                const top = (index / logs.length) * containerHeight;
                const lineNum = log.line;

                if (log.isHighlighted && leftCount < maxMarkers) {
                    leftHtml.push(`<div class="indicator-marker absolute w-full h-1 bg-yellow-400 cursor-pointer hover:h-2 transition-all" style="top: ${top}px" data-line="${lineNum}" title="하이라이트 Line #${lineNum}"></div>`);
                    leftCount++;
                } else if (log.isBookmarked && leftCount < maxMarkers) {
                    leftHtml.push(`<div class="indicator-marker absolute w-full h-1 bg-blue-400 cursor-pointer hover:h-2 transition-all" style="top: ${top}px" data-line="${lineNum}" title="북마크 Line #${lineNum}"></div>`);
                    leftCount++;
                }

                if ((log.level === 'ERROR' || log.level === 'FATAL') && rightCount < maxMarkers) {
                    rightHtml.push(`<div class="indicator-marker absolute w-full h-1 bg-red-500 cursor-pointer hover:h-2 transition-all" style="top: ${top}px" data-line="${lineNum}" title="에러 Line #${lineNum}"></div>`);
                    rightCount++;
                } else if (log.level === 'WARN' && rightCount < maxMarkers) {
                    rightHtml.push(`<div class="indicator-marker absolute w-full h-1 bg-orange-400 cursor-pointer hover:h-2 transition-all" style="top: ${top}px" data-line="${lineNum}" title="경고 Line #${lineNum}"></div>`);
                    rightCount++;
                }
            });

            // 한 번에 innerHTML 설정 (DOM 재파싱 1회만)
            leftContainer.innerHTML = leftHtml.join('');
            rightContainer.innerHTML = rightHtml.join('');

            // 인디케이터 클릭 이벤트 (이벤트 위임)
            [leftContainer, rightContainer].forEach(container => {
                container.onclick = function(e) {
                    const marker = e.target.closest('.indicator-marker');
                    if (!marker) return;

                    const lineNum = parseInt(marker.dataset.line);
                    if (!isNaN(lineNum)) {
                        // line 번호로 현재 filteredLogs에서 인덱스 찾기
                        const currentIndex = filteredLogs.findIndex(log => log.line === lineNum);
                        if (currentIndex >= 0) {
                            // 자동 스크롤 OFF (사용자가 특정 위치로 이동)
                            autoScroll = false;
                            updateAutoScrollStatus();

                            // 스크롤 후 렌더링 완료되면 행 선택
                            scrollToRow(currentIndex, () => selectRow(currentIndex));
                        }
                    }
                };
            });
        }

        function updateLogCount() {
            document.getElementById('log-count-value').textContent = allLogs.length;
            document.getElementById('display-count').textContent = `표시: ${filteredLogs.length}줄`;
        }

        function setStatus(message) {
            document.getElementById('status-text').textContent = message;
        }

        // JSON 객체 추출 (괄호 카운팅 방식 - 정규식 백트래킹 방지)
        function extractJsonObjects(str) {
            const results = [];
            const len = str.length;
            let i = 0;

            while (i < len) {
                const ch = str[i];
                if (ch === '{' || ch === '[') {
                    const closingChar = ch === '{' ? '}' : ']';
                    let depth = 1;
                    let start = i;
                    let inString = false;
                    let escape = false;
                    i++;

                    while (i < len && depth > 0) {
                        const c = str[i];
                        if (escape) {
                            escape = false;
                        } else if (c === '\\') {
                            escape = true;
                        } else if (c === '"') {
                            inString = !inString;
                        } else if (!inString) {
                            if (c === ch) depth++;
                            else if (c === closingChar) depth--;
                        }
                        i++;
                    }

                    if (depth === 0) {
                        results.push(str.substring(start, i));
                    }
                } else {
                    i++;
                }

                // 성능: 최대 3개까지만 추출
                if (results.length >= 3) break;
            }
            return results;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function escapeRegex(str) {
            return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function attachRowEvents() {
            document.querySelectorAll('.log-table tbody tr[data-index]').forEach(row => {
                row.addEventListener('click', function(e) {
                    // JSON 클릭 처리 (preview 또는 expanded 상태 모두)
                    if (e.target.classList.contains('json-preview') || e.target.classList.contains('json-expanded')) {
                        toggleJsonExpand(e.target);
                        return;
                    }

                    document.querySelectorAll('.log-table tr.log-row-selected').forEach(r => r.classList.remove('log-row-selected'));
                    this.classList.add('log-row-selected');
                });

                row.addEventListener('dblclick', function() {
                    const index = parseInt(this.dataset.index);
                    if (!isNaN(index) && filteredLogs[index]) {
                        filteredLogs[index].isBookmarked = !filteredLogs[index].isBookmarked;
                        applyFilter();
                    }
                });
            });
        }

        // JSON 토글 함수
        function toggleJsonExpand(element) {
            const isExpanded = element.classList.contains('json-expanded');
            const originalJson = element.dataset.json;

            // 로그 객체에 상태 저장
            const row = element.closest('tr[data-index]');
            const index = row ? parseInt(row.dataset.index) : -1;
            const log = index >= 0 ? filteredLogs[index] : null;

            if (isExpanded) {
                element.classList.remove('json-expanded');
                element.classList.add('json-preview');
                element.textContent = originalJson.length > 100 ? originalJson.substring(0, 100) + '...' : originalJson;
                if (log) log.jsonExpanded = false;
            } else {
                try {
                    const parsed = JSON.parse(originalJson);
                    const formatted = JSON.stringify(parsed, null, 2);
                    element.classList.remove('json-preview');
                    element.classList.add('json-expanded');
                    element.textContent = formatted;
                    if (log) log.jsonExpanded = true;
                } catch (e) {
                    element.textContent = originalJson;
                }
            }
        }

        // ===== 초기화 =====
        function setupEventListeners() {
            podSearch.init();

            document.getElementById('context')?.addEventListener('change', () => {
                saveSettings();
                loadNamespaces();
            });
            document.getElementById('namespace')?.addEventListener('change', () => {
                saveSettings();
                loadPods();
            });

            document.querySelectorAll('fieldset input').forEach(input => {
                input.addEventListener('change', () => {
                    invalidateFilterCache();  // 즉시 캐시 무효화
                    applyFilter();
                    updateFilterInputStyles();
                });
                // 입력 시 즉시 캐시 무효화, 전체 필터는 debounce
                input.addEventListener('input', () => {
                    invalidateFilterCache();  // 즉시 캐시 무효화 (스트리밍 중 새 로그용)
                    updateFilterInputStyles();
                });
                input.addEventListener('input', debounce(() => {
                    applyFilter();  // 전체 필터링은 debounce
                }, 500));
            });

            // 초기 필터 입력 스타일 설정
            updateFilterInputStyles();

            document.getElementById('font-apply')?.addEventListener('click', () => {
                const fontSize = document.getElementById('font-size')?.value || 12;
                document.querySelector('.log-table').style.fontSize = fontSize + 'px';
            });

            document.getElementById('goto-line')?.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const line = parseInt(e.target.value);
                    if (line) {
                        const row = document.querySelector(`.log-table tbody tr[data-index="${line - 1}"]`);
                        if (row) {
                            row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            selectRow(line - 1);
                        }
                    }
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'F3' && !e.shiftKey) {
                    e.preventDefault();
                    navigateHighlight(1);
                } else if (e.key === 'F3' && e.shiftKey) {
                    e.preventDefault();
                    navigateHighlight(-1);
                } else if (e.key === 'g' && e.ctrlKey) {
                    e.preventDefault();
                    document.getElementById('goto-line')?.focus();
                } else if (e.key === 'c' && (e.ctrlKey || e.metaKey)) {
                    // Ctrl+C / Cmd+C: 선택된 로그 복사
                    if (selectedLogIndices.size > 0) {
                        e.preventDefault();
                        copySelectedLogs();
                    }
                } else if (e.key === 'a' && (e.ctrlKey || e.metaKey)) {
                    // Ctrl+A: 전체 선택 (포커스가 입력창에 없을 때)
                    const activeEl = document.activeElement;
                    if (activeEl?.tagName !== 'INPUT' && activeEl?.tagName !== 'TEXTAREA') {
                        e.preventDefault();
                        selectAllLogs();
                    }
                } else if (e.key === 'Escape') {
                    const activeEl = document.activeElement;
                    if (activeEl?.tagName === 'INPUT') {
                        activeEl.blur();
                    } else {
                        // 선택 해제
                        clearSelection();
                    }
                }
            });
        }

        function debounce(func, wait) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }

        // 필터 입력 스타일 업데이트 (체크박스 상태에 따라)
        function updateFilterInputStyles() {
            const filterPairs = [
                ['word-find', 'word-find-enabled'],
                ['word-remove', 'word-remove-enabled'],
                ['class-show', 'class-show-enabled'],
                ['class-remove', 'class-remove-enabled'],
                ['highlight-keyword', 'highlight-enabled']
            ];

            filterPairs.forEach(([inputId, checkboxId]) => {
                const input = document.getElementById(inputId);
                const checkbox = document.getElementById(checkboxId);
                if (input && checkbox) {
                    if (checkbox.checked) {
                        input.classList.remove('filter-disabled');
                    } else {
                        input.classList.add('filter-disabled');
                    }
                }
            });
        }

        // 글로벌 에러 핸들러
        window.onerror = function(msg, url, line, col, error) {
            console.error('[GLOBAL ERROR]', msg, 'at', line, ':', col);
            setStatus('JS 오류: ' + msg);
            return false;
        };

        // 전역 함수 노출
        window.applyFilter = applyFilter;
        window.renderLogs = renderLogs;
        window.addLogEntry = addLogEntry;
        window.fetchAllLogs = fetchAllLogs;

        window.onload = function() {
            // 배열 참조 재설정 (페이지 로드 후)
            window.allLogs = allLogs;
            window.filteredLogs = filteredLogs;

            loadTheme();
            applySettings();  // tail 설정 등 로드
            updatePresetDropdown();
            setupEventListeners();
            loadContexts();

            // 초기 메시지 표시 (풀 초기화 전)
            const tbody = document.querySelector('.log-table tbody');
            tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5 text-gray-500 dark:text-gray-400">Pod를 선택하고 연결하세요</td></tr>';
        };
    </script>

</body>
</html>
