<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K8s Log Viewer v2.0 - UI Mockup</title>
    <style>
        /* CSS 변수 - 라이트 모드 (기본) */
        :root {
            --bg-primary: #f5f5f5;
            --bg-secondary: #fafafa;
            --bg-panel: #f0f0f0;
            --bg-table: #fff;
            --bg-table-hover: #f5f5f5;
            --bg-selected: #cce5ff;
            --text-primary: #333;
            --text-secondary: #666;
            --text-muted: #888;
            --border-color: #ccc;
            --border-light: #eee;
            --input-bg: #fff;
            --input-border: #ccc;
            --btn-primary: #4CAF50;
            --btn-danger: #f44336;
            --highlight-bg: #FFFF99;
            --bookmark-bg: #E3F2FD;
            --error-bg: #FFEBEE;
            --warn-bg: #FFF8E1;
        }

        /* 다크 모드 */
        [data-theme="dark"] {
            --bg-primary: #1e1e1e;
            --bg-secondary: #252526;
            --bg-panel: #2d2d2d;
            --bg-table: #1e1e1e;
            --bg-table-hover: #2a2d2e;
            --bg-selected: #264f78;
            --text-primary: #d4d4d4;
            --text-secondary: #a0a0a0;
            --text-muted: #808080;
            --border-color: #404040;
            --border-light: #333;
            --input-bg: #3c3c3c;
            --input-border: #555;
            --btn-primary: #0e7a0d;
            --btn-danger: #a31515;
            --highlight-bg: #4a4a00;
            --bookmark-bg: #0d3a58;
            --error-bg: #3a1515;
            --warn-bg: #3a3515;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s, color 0.3s;
        }

        /* 메뉴바 */
        .menubar {
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            padding: 4px 8px;
            display: flex;
            gap: 16px;
            justify-content: space-between;
        }

        .menubar-left {
            display: flex;
            gap: 16px;
        }

        .menubar .menu-item {
            padding: 4px 12px;
            cursor: pointer;
            border-radius: 4px;
            color: var(--text-primary);
        }

        .menubar .menu-item:hover {
            background-color: var(--bg-secondary);
        }

        /* 테마 토글 버튼 */
        .theme-toggle {
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 4px 10px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-primary);
        }

        .theme-toggle:hover {
            background-color: var(--bg-secondary);
        }

        /* 패널 공통 스타일 */
        .panel {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 8px 12px;
        }

        .panel-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            flex-wrap: wrap;
        }

        .panel-row + .panel-row {
            margin-top: 8px;
        }

        /* 라벨 스타일 */
        label {
            font-size: 13px;
            color: var(--text-primary);
        }

        /* 입력 요소 */
        select, input[type="text"], input[type="number"] {
            padding: 4px 8px;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            font-size: 13px;
            background-color: var(--input-bg);
            color: var(--text-primary);
        }

        select {
            min-width: 150px;
        }

        input[type="text"] {
            width: 160px;
        }

        input[type="text"].narrow {
            width: 130px;
        }

        button {
            padding: 6px 16px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--input-bg);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 13px;
        }

        button:hover {
            background-color: var(--bg-secondary);
        }

        button.primary {
            background-color: var(--btn-primary);
            color: white;
            border-color: var(--btn-primary);
        }

        button.primary:hover {
            opacity: 0.9;
        }

        button.danger {
            background-color: var(--btn-danger);
            color: white;
            border-color: var(--btn-danger);
        }

        button.danger:hover {
            opacity: 0.9;
        }

        /* 체크박스 */
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 16px;
            height: 16px;
        }

        /* 필터 체크박스 (굵게) */
        .filter-toggle {
            font-weight: bold;
        }

        /* 세로 구분선 */
        .separator {
            width: 1px;
            height: 40px;
            background-color: #ccc;
        }

        /* 필터 그룹 박스 */
        .filter-group-box {
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 8px 12px;
            position: relative;
            background-color: var(--bg-secondary);
        }

        .filter-group-box legend {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            padding: 0 6px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-row label {
            width: 55px;
            text-align: right;
        }

        .filter-row.narrow label {
            width: 45px;
        }

        .filter-row input[type="text"] {
            flex: 1;
        }

        .filter-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
        }

        /* 로그 레벨 체크박스 */
        .level-filters {
            display: flex;
            gap: 12px;
            align-items: center;
            padding-top: 8px;
        }

        .level-filters-inline {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .level-checkbox {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .level-TRACE { color: #808080; }
        .level-DEBUG { color: #0000AA; }
        .level-INFO { color: #00AA00; }
        .level-WARN { color: #FF9A00; }
        .level-ERROR { color: #FF0000; }
        .level-FATAL { color: #FF0000; }

        /* 메인 영역 */
        .main-area {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* 인디케이터 패널 */
        .indicator-panel {
            width: 70px;
            background-color: #2D2D2D;
            border-right: 1px solid #444;
            display: flex;
            flex-direction: column;
            padding: 5px;
        }

        .indicator-controls {
            display: flex;
            gap: 5px;
            margin-bottom: 5px;
        }

        .indicator-controls label {
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .indicator-controls .bookmark-label {
            color: #FFD700;
        }

        .indicator-controls .error-label {
            color: #FF5252;
        }

        .indicator-canvas {
            flex: 1;
            background-color: #1E1E1E;
            border: 1px solid #555;
            position: relative;
            min-height: 200px;
            display: flex;
        }

        /* 인디케이터 좌/우 분할 영역 */
        .indicator-left {
            width: 50%;
            position: relative;
            border-right: 1px solid #444;
        }

        .indicator-right {
            width: 50%;
            position: relative;
        }

        /* 인디케이터 마커 */
        .indicator-marker {
            position: absolute;
            height: 4px;
            left: 1px;
            right: 1px;
        }

        /* 좌측: 하이라이트 (노란색) */
        .indicator-marker.highlight {
            background-color: #FFEE58;
        }

        /* 좌측: 북마크 (파란색) */
        .indicator-marker.bookmark {
            background-color: #42A5F5;
        }

        /* 우측: 에러 (빨간색) */
        .indicator-marker.error {
            background-color: #FF5252;
        }

        /* 우측: 경고 (주황색) */
        .indicator-marker.warn {
            background-color: #FFB74D;
        }

        /* 로그 테이블 - 가상 스크롤 지원 */
        .log-table-container {
            flex: 1;
            overflow: auto;
            background-color: var(--bg-table);
            position: relative;
        }

        .virtual-scroll-spacer {
            width: 100%;
            pointer-events: none;
        }

        .log-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .log-table th {
            background-color: var(--bg-panel);
            border-bottom: 2px solid var(--border-color);
            padding: 8px 6px;
            text-align: left;
            position: sticky;
            top: 0;
            font-weight: 600;
            color: var(--text-primary);
            z-index: 10;
        }

        .log-table td {
            padding: 4px 6px;
            border-bottom: 1px solid var(--border-light);
            vertical-align: top;
            color: var(--text-primary);
        }

        .log-table tr:hover {
            background-color: var(--bg-table-hover);
        }

        /* 컬럼 너비 */
        .col-bookmark { width: 30px; text-align: center; color: #FFD700; }
        .col-line { width: 60px; text-align: right; }
        .col-datetime { width: 180px; }
        .col-level { width: 60px; text-align: center; font-weight: bold; }
        .col-thread { width: 150px; color: #6A5ACD; }
        .col-class { width: 200px; color: #2E8B57; }
        .col-message { min-width: 400px; }

        /* 로그 행 배경색 */
        .log-row-highlight { background-color: var(--highlight-bg) !important; }
        .log-row-bookmark { background-color: var(--bookmark-bg) !important; }
        .log-row-error { background-color: var(--error-bg) !important; }
        .log-row-warn { background-color: var(--warn-bg) !important; }

        /* 선택된 행 */
        .log-table tr.selected {
            background-color: var(--bg-selected) !important;
        }

        /* 키워드 하이라이트 */
        .keyword-match {
            color: #FF6600;
            font-weight: bold;
        }

        /* 상태바 */
        .statusbar {
            background-color: var(--bg-panel);
            border-top: 1px solid var(--border-color);
            padding: 6px 12px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .statusbar-right {
            display: flex;
            gap: 20px;
        }

        /* 컨트롤 패널 */
        .control-panel {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .control-panel .log-count {
            font-weight: bold;
            color: #333;
        }

        /* 반응형 */
        @media (max-width: 1200px) {
            .panel-row {
                gap: 12px;
            }

            input[type="text"] {
                width: 120px;
            }
        }

        /* 검색 가능한 드롭다운 */
        .searchable-dropdown {
            position: relative;
            display: inline-block;
        }

        .searchable-dropdown-trigger {
            min-width: 350px;
            padding: 4px 28px 4px 8px;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            font-size: 13px;
            background-color: var(--input-bg);
            color: var(--text-primary);
            cursor: pointer;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .searchable-dropdown-trigger::after {
            content: '▼';
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 10px;
            color: #666;
        }

        .searchable-dropdown-trigger:focus {
            outline: 2px solid #4CAF50;
            outline-offset: -1px;
        }

        .searchable-dropdown-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            max-height: 300px;
            overflow-y: auto;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-top: none;
            border-radius: 0 0 4px 4px;
            z-index: 1000;
            display: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        .searchable-dropdown-list.open {
            display: block;
        }

        .searchable-dropdown-item {
            padding: 6px 10px;
            cursor: pointer;
            font-size: 13px;
            border-bottom: 1px solid var(--border-light);
            color: var(--text-primary);
        }

        .searchable-dropdown-item:hover,
        .searchable-dropdown-item.highlighted {
            background-color: var(--bg-selected);
        }

        .searchable-dropdown-item.selected {
            background-color: var(--btn-primary);
            color: white;
        }

        .searchable-dropdown-item.hidden {
            display: none;
        }

        .searchable-dropdown-item .match {
            background-color: #FFFF00;
            font-weight: bold;
        }

        /* 검색어 입력 팝업 */
        .search-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 15px 25px;
            border-radius: 8px;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            z-index: 2000;
            display: none;
            min-width: 100px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .search-popup.visible {
            display: block;
            animation: popup-fade 0.15s ease-out;
        }

        .search-popup .search-text {
            color: #4CAF50;
        }

        .search-popup .hint {
            font-size: 11px;
            color: #999;
            margin-top: 8px;
            letter-spacing: 0;
        }

        @keyframes popup-fade {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
    </style>
</head>
<body>

    <!-- 메뉴바 -->
    <div class="menubar">
        <div class="menubar-left">
            <span class="menu-item">파일</span>
            <span class="menu-item">편집</span>
            <span class="menu-item">보기</span>
            <span class="menu-item">도움말</span>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" id="theme-toggle">🌙 다크</button>
    </div>

    <!-- K8s 선택 패널 -->
    <div class="panel">
        <div class="panel-row">
            <label>Context:</label>
            <select id="context">
                <option value="">-- 로딩 중 --</option>
            </select>

            <label>Namespace:</label>
            <select id="namespace">
                <option value="">-- Context 선택 --</option>
            </select>

            <button onclick="loadContexts()">새로고침</button>
        </div>
        <div class="panel-row">
            <label>Pod:</label>
            <div class="searchable-dropdown" id="pod-dropdown">
                <button type="button" class="searchable-dropdown-trigger" id="pod-trigger">
                    -- Pod 선택 --
                </button>
                <div class="searchable-dropdown-list" id="pod-list">
                    <!-- 동적으로 채워짐 -->
                </div>
            </div>
            <input type="hidden" id="pod" value="">

            <label>Container:</label>
            <select id="container">
                <option value="">-</option>
            </select>

            <button class="primary" onclick="connectPod()">연결</button>
        </div>
    </div>

    <!-- 필터 패널 -->
    <div class="panel">
        <div class="panel-row">
            <!-- Filter Presets -->
            <fieldset class="filter-group-box">
                <legend>Presets</legend>
                <div class="filter-group">
                    <div class="filter-row" style="gap: 5px;">
                        <select id="preset-select" style="width: 120px; padding: 3px;">
                            <option value="">-- 선택 --</option>
                        </select>
                        <button onclick="loadPreset()" title="프리셋 적용" style="padding: 2px 8px;">적용</button>
                        <button onclick="savePreset()" title="현재 필터 저장" style="padding: 2px 8px;">저장</button>
                        <button onclick="deletePreset()" title="프리셋 삭제" style="padding: 2px 8px; color: var(--level-error);">삭제</button>
                    </div>
                </div>
            </fieldset>

            <!-- Word Filter -->
            <fieldset class="filter-group-box">
                <legend>Word filter</legend>
                <div class="filter-group">
                    <div class="filter-row">
                        <label>Find:</label>
                        <input type="text" id="word-find" placeholder="검색어 (| 로 구분)" style="width: 200px;">
                        <input type="checkbox" id="word-find-enabled" checked title="Find 필터 활성화">
                    </div>
                    <div class="filter-row">
                        <label>Remove:</label>
                        <input type="text" id="word-remove" placeholder="제외어 (| 로 구분)" style="width: 200px;">
                        <input type="checkbox" id="word-remove-enabled" checked title="Remove 필터 활성화">
                    </div>
                </div>
            </fieldset>

            <!-- Class Filter -->
            <fieldset class="filter-group-box">
                <legend>Class filter</legend>
                <div class="filter-group">
                    <div class="filter-row narrow">
                        <label>Show:</label>
                        <input type="text" id="class-show" placeholder="표시할 클래스" style="width: 150px;">
                        <input type="checkbox" id="class-show-enabled" checked title="Show 필터 활성화">
                    </div>
                    <div class="filter-row narrow">
                        <label>Remove:</label>
                        <input type="text" id="class-remove" placeholder="제외할 클래스" style="width: 150px;">
                        <input type="checkbox" id="class-remove-enabled" checked title="Remove 필터 활성화">
                    </div>
                </div>
            </fieldset>

            <!-- Highlight -->
            <fieldset class="filter-group-box">
                <legend>Highlight</legend>
                <div class="filter-group">
                    <div class="filter-row">
                        <label>Keyword:</label>
                        <input type="text" id="highlight-keyword" placeholder="하이라이트 키워드" style="width: 120px;">
                        <input type="checkbox" id="highlight-enabled" checked title="하이라이트 활성화">
                        <span id="highlight-count" style="margin-left: 8px; font-size: 11px; color: var(--text-muted); min-width: 45px;">0/0</span>
                        <button id="highlight-prev" onclick="navigateHighlight(-1)" title="이전 (Shift+F3)" style="padding: 2px 6px; font-size: 11px;">▲</button>
                        <button id="highlight-next" onclick="navigateHighlight(1)" title="다음 (F3)" style="padding: 2px 6px; font-size: 11px;">▼</button>
                    </div>
                </div>
            </fieldset>

            <!-- Log Level Filter -->
            <fieldset class="filter-group-box">
                <legend>Log filter</legend>
                <div class="level-filters-inline">
                    <div class="level-checkbox">
                        <input type="checkbox" id="level-verbose" checked>
                        <label for="level-verbose" class="level-TRACE">Verbose</label>
                    </div>
                    <div class="level-checkbox">
                        <input type="checkbox" id="level-debug" checked>
                        <label for="level-debug" class="level-DEBUG">Debug</label>
                    </div>
                    <div class="level-checkbox">
                        <input type="checkbox" id="level-info" checked>
                        <label for="level-info" class="level-INFO">Info</label>
                    </div>
                    <div class="level-checkbox">
                        <input type="checkbox" id="level-warn" checked>
                        <label for="level-warn" class="level-WARN">Warn</label>
                    </div>
                    <div class="level-checkbox">
                        <input type="checkbox" id="level-error" checked>
                        <label for="level-error" class="level-ERROR">Error</label>
                    </div>
                    <div class="level-checkbox">
                        <input type="checkbox" id="level-fatal" checked>
                        <label for="level-fatal" class="level-FATAL">Fatal</label>
                    </div>
                </div>
            </fieldset>

            <!-- Font Settings -->
            <fieldset class="filter-group-box">
                <legend>Font</legend>
                <div class="filter-row" style="gap: 10px;">
                    <label style="width: auto;">Font Size:</label>
                    <input type="number" id="font-size" value="12" min="8" max="24" style="width: 50px;">
                    <button id="font-apply" style="padding: 2px 8px;">OK</button>
                    <label style="width: auto; margin-left: 15px;">Goto:</label>
                    <input type="text" id="goto-line" placeholder="" style="width: 60px;">
                </div>
            </fieldset>
        </div>
    </div>

    <!-- 컨트롤 패널 -->
    <div class="panel">
        <div class="control-panel">
            <span class="log-count">로그: <strong>0</strong>줄</span>
            <button class="primary" onclick="connectPod()">▶ 시작</button>
            <button onclick="loadSampleLogs()">📥 샘플 로드</button>
            <button onclick="downloadLogs()">💾 다운로드</button>
            <button class="danger" onclick="clearLogs()">🗑 클리어</button>
        </div>
    </div>

    <!-- 메인 영역 (인디케이터 + 로그 테이블) -->
    <div class="main-area">
        <!-- 인디케이터 패널 -->
        <div class="indicator-panel">
            <div class="indicator-controls">
                <label>
                    <input type="checkbox" checked>
                    <span class="bookmark-label">★</span>
                </label>
                <label>
                    <input type="checkbox" checked>
                    <span class="error-label">E</span>
                </label>
            </div>
            <div class="indicator-canvas">
                <!-- 좌측: 하이라이트/북마크 -->
                <div class="indicator-left"></div>
                <!-- 우측: 에러/경고 -->
                <div class="indicator-right"></div>
            </div>
        </div>

        <!-- 로그 테이블 -->
        <div class="log-table-container">
            <table class="log-table">
                <thead>
                    <tr>
                        <th class="col-bookmark">★</th>
                        <th class="col-line">Line</th>
                        <th class="col-datetime">DateTime</th>
                        <th class="col-level">Level</th>
                        <th class="col-thread">Thread</th>
                        <th class="col-class">Class</th>
                        <th class="col-message">Message</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- 동적으로 채워짐 -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- 상태바 -->
    <div class="statusbar">
        <span>준비됨</span>
        <div class="statusbar-right">
            <span id="auto-scroll-status" onclick="toggleAutoScroll()" style="cursor: pointer;">자동스크롤: ON</span>
            <span id="display-count">표시: 0줄</span>
        </div>
    </div>

    <!-- 검색어 입력 팝업 -->
    <div class="search-popup" id="search-popup">
        <span class="search-text" id="search-text"></span>
        <div class="hint">ESC: 취소 / Enter: 선택</div>
    </div>

    <script>
        // ===== 전역 상태 =====
        let allLogs = [];
        let filteredLogs = [];
        let podList = [];  // Pod 목록 저장
        let eventSource = null;  // SSE 연결
        let streamId = null;     // 현재 스트림 ID
        let isStreaming = false; // 스트리밍 상태
        let autoScroll = true;   // 자동 스크롤

        // 하이라이트 네비게이션 상태
        let highlightedIndices = [];  // 하이라이트된 로그의 인덱스 목록
        let currentHighlightPos = -1; // 현재 하이라이트 위치 (0-based)

        // 가상 스크롤 설정
        const virtualScroll = {
            rowHeight: 28,       // 행 높이 (px)
            bufferSize: 20,      // 위/아래 버퍼 행 수
            visibleStart: 0,     // 현재 보이는 시작 인덱스
            visibleEnd: 0,       // 현재 보이는 끝 인덱스
            enabled: true,       // 가상 스크롤 활성화 (1000줄 이상일 때)
            threshold: 1000      // 활성화 임계값
        };

        // ===== Pod 검색 드롭다운 =====
        const podSearch = {
            searchText: '',
            isOpen: false,
            highlightedIndex: -1,
            hideTimeout: null,

            init() {
                const trigger = document.getElementById('pod-trigger');
                const list = document.getElementById('pod-list');
                const popup = document.getElementById('search-popup');

                // 트리거 클릭 시 드롭다운 토글
                trigger.addEventListener('click', () => this.toggle());

                // 트리거에 포커스 있을 때 키보드 이벤트
                trigger.addEventListener('keydown', (e) => this.handleKeydown(e));

                // 드롭다운 외부 클릭 시 닫기
                document.addEventListener('click', (e) => {
                    if (!e.target.closest('#pod-dropdown')) {
                        this.close();
                    }
                });
            },

            toggle() {
                if (this.isOpen) {
                    this.close();
                } else {
                    this.open();
                }
            },

            open() {
                const list = document.getElementById('pod-list');
                list.classList.add('open');
                this.isOpen = true;
                this.searchText = '';
                this.highlightedIndex = -1;
                this.updateFilter();
                document.getElementById('pod-trigger').focus();
            },

            close() {
                const list = document.getElementById('pod-list');
                list.classList.remove('open');
                this.isOpen = false;
                this.searchText = '';
                this.hideSearchPopup();
            },

            handleKeydown(e) {
                if (!this.isOpen && (e.key.length === 1 || e.key === 'ArrowDown')) {
                    this.open();
                }

                if (!this.isOpen) return;

                const items = this.getVisibleItems();

                switch (e.key) {
                    case 'Escape':
                        this.close();
                        e.preventDefault();
                        break;

                    case 'ArrowDown':
                        e.preventDefault();
                        this.highlightedIndex = Math.min(this.highlightedIndex + 1, items.length - 1);
                        this.updateHighlight();
                        break;

                    case 'ArrowUp':
                        e.preventDefault();
                        this.highlightedIndex = Math.max(this.highlightedIndex - 1, 0);
                        this.updateHighlight();
                        break;

                    case 'Enter':
                        e.preventDefault();
                        if (this.highlightedIndex >= 0 && items[this.highlightedIndex]) {
                            this.selectItem(items[this.highlightedIndex].dataset.value);
                        } else if (items.length === 1) {
                            this.selectItem(items[0].dataset.value);
                        }
                        break;

                    case 'Backspace':
                        e.preventDefault();
                        this.searchText = this.searchText.slice(0, -1);
                        this.updateFilter();
                        this.showSearchPopup();
                        break;

                    default:
                        // 일반 문자 입력
                        if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
                            e.preventDefault();
                            this.searchText += e.key.toLowerCase();
                            this.updateFilter();
                            this.showSearchPopup();
                            // 첫 번째 매칭 항목 하이라이트
                            const newItems = this.getVisibleItems();
                            if (newItems.length > 0) {
                                this.highlightedIndex = 0;
                                this.updateHighlight();
                            }
                        }
                }
            },

            getVisibleItems() {
                return Array.from(document.querySelectorAll('#pod-list .searchable-dropdown-item:not(.hidden)'));
            },

            updateFilter() {
                const items = document.querySelectorAll('#pod-list .searchable-dropdown-item');
                const search = this.searchText.toLowerCase();

                items.forEach(item => {
                    const text = item.dataset.text.toLowerCase();
                    if (!search || text.includes(search)) {
                        item.classList.remove('hidden');
                        // 검색어 하이라이트
                        if (search) {
                            const regex = new RegExp(`(${this.escapeRegex(search)})`, 'gi');
                            item.innerHTML = item.dataset.text.replace(regex, '<span class="match">$1</span>');
                        } else {
                            item.innerHTML = item.dataset.text;
                        }
                    } else {
                        item.classList.add('hidden');
                    }
                });

                // 하이라이트 인덱스 리셋
                if (this.highlightedIndex >= 0) {
                    const visibleItems = this.getVisibleItems();
                    if (this.highlightedIndex >= visibleItems.length) {
                        this.highlightedIndex = visibleItems.length - 1;
                    }
                }
            },

            updateHighlight() {
                const items = document.querySelectorAll('#pod-list .searchable-dropdown-item');
                items.forEach(item => item.classList.remove('highlighted'));

                const visibleItems = this.getVisibleItems();
                if (this.highlightedIndex >= 0 && visibleItems[this.highlightedIndex]) {
                    visibleItems[this.highlightedIndex].classList.add('highlighted');
                    visibleItems[this.highlightedIndex].scrollIntoView({ block: 'nearest' });
                }
            },

            selectItem(value) {
                const pod = podList.find(p => p.name === value);
                if (pod) {
                    document.getElementById('pod').value = value;
                    document.getElementById('pod-trigger').textContent = `${pod.name} (${pod.status}, ${pod.ready})`;
                    saveSettings();
                }
                this.close();
            },

            showSearchPopup() {
                const popup = document.getElementById('search-popup');
                const searchText = document.getElementById('search-text');

                if (this.searchText) {
                    searchText.textContent = this.searchText;
                    popup.classList.add('visible');

                    // 자동 숨김 타이머 리셋
                    clearTimeout(this.hideTimeout);
                    this.hideTimeout = setTimeout(() => {
                        if (!this.searchText) {
                            this.hideSearchPopup();
                        }
                    }, 2000);
                } else {
                    this.hideSearchPopup();
                }
            },

            hideSearchPopup() {
                const popup = document.getElementById('search-popup');
                popup.classList.remove('visible');
                clearTimeout(this.hideTimeout);
            },

            escapeRegex(str) {
                return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            },

            // Pod 목록 설정
            setItems(pods) {
                podList = pods;
                const list = document.getElementById('pod-list');
                list.innerHTML = pods.map(p => {
                    const text = `${p.name} (${p.status}, ${p.ready})`;
                    return `<div class="searchable-dropdown-item" data-value="${p.name}" data-text="${text}">${text}</div>`;
                }).join('');

                // 항목 클릭 이벤트
                list.querySelectorAll('.searchable-dropdown-item').forEach(item => {
                    item.addEventListener('click', () => {
                        this.selectItem(item.dataset.value);
                    });
                    item.addEventListener('mouseenter', () => {
                        const items = this.getVisibleItems();
                        this.highlightedIndex = items.indexOf(item);
                        this.updateHighlight();
                    });
                });
            },

            // 값 설정
            setValue(value) {
                const pod = podList.find(p => p.name === value);
                if (pod) {
                    document.getElementById('pod').value = value;
                    document.getElementById('pod-trigger').textContent = `${pod.name} (${pod.status}, ${pod.ready})`;
                } else {
                    document.getElementById('pod').value = '';
                    document.getElementById('pod-trigger').textContent = '-- Pod 선택 --';
                }
            }
        };

        // ===== 설정 저장/로드 =====
        const STORAGE_KEY = 'k8s-log-viewer-settings';

        function saveSettings() {
            const settings = {
                context: document.getElementById('context').value,
                namespace: document.getElementById('namespace').value,
                pod: document.getElementById('pod').value
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
        }

        function loadSettings() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                return saved ? JSON.parse(saved) : {};
            } catch {
                return {};
            }
        }

        // ===== 필터 프리셋 =====
        const PRESETS_KEY = 'k8s-log-viewer-presets';

        function getFilterState() {
            return {
                wordFind: document.getElementById('word-find')?.value || '',
                wordFindEnabled: document.getElementById('word-find-enabled')?.checked ?? true,
                wordRemove: document.getElementById('word-remove')?.value || '',
                wordRemoveEnabled: document.getElementById('word-remove-enabled')?.checked ?? true,
                classShow: document.getElementById('class-show')?.value || '',
                classShowEnabled: document.getElementById('class-show-enabled')?.checked ?? true,
                classRemove: document.getElementById('class-remove')?.value || '',
                classRemoveEnabled: document.getElementById('class-remove-enabled')?.checked ?? true,
                highlightKeyword: document.getElementById('highlight-keyword')?.value || '',
                highlightEnabled: document.getElementById('highlight-enabled')?.checked ?? true,
                levels: {
                    verbose: document.getElementById('level-verbose')?.checked ?? true,
                    debug: document.getElementById('level-debug')?.checked ?? true,
                    info: document.getElementById('level-info')?.checked ?? true,
                    warn: document.getElementById('level-warn')?.checked ?? true,
                    error: document.getElementById('level-error')?.checked ?? true,
                    fatal: document.getElementById('level-fatal')?.checked ?? true
                }
            };
        }

        function setFilterState(state) {
            if (!state) return;

            if (state.wordFind !== undefined) document.getElementById('word-find').value = state.wordFind;
            if (state.wordFindEnabled !== undefined) document.getElementById('word-find-enabled').checked = state.wordFindEnabled;
            if (state.wordRemove !== undefined) document.getElementById('word-remove').value = state.wordRemove;
            if (state.wordRemoveEnabled !== undefined) document.getElementById('word-remove-enabled').checked = state.wordRemoveEnabled;
            if (state.classShow !== undefined) document.getElementById('class-show').value = state.classShow;
            if (state.classShowEnabled !== undefined) document.getElementById('class-show-enabled').checked = state.classShowEnabled;
            if (state.classRemove !== undefined) document.getElementById('class-remove').value = state.classRemove;
            if (state.classRemoveEnabled !== undefined) document.getElementById('class-remove-enabled').checked = state.classRemoveEnabled;
            if (state.highlightKeyword !== undefined) document.getElementById('highlight-keyword').value = state.highlightKeyword;
            if (state.highlightEnabled !== undefined) document.getElementById('highlight-enabled').checked = state.highlightEnabled;

            if (state.levels) {
                if (state.levels.verbose !== undefined) document.getElementById('level-verbose').checked = state.levels.verbose;
                if (state.levels.debug !== undefined) document.getElementById('level-debug').checked = state.levels.debug;
                if (state.levels.info !== undefined) document.getElementById('level-info').checked = state.levels.info;
                if (state.levels.warn !== undefined) document.getElementById('level-warn').checked = state.levels.warn;
                if (state.levels.error !== undefined) document.getElementById('level-error').checked = state.levels.error;
                if (state.levels.fatal !== undefined) document.getElementById('level-fatal').checked = state.levels.fatal;
            }

            applyFilter();
        }

        function loadPresets() {
            try {
                const saved = localStorage.getItem(PRESETS_KEY);
                return saved ? JSON.parse(saved) : {};
            } catch {
                return {};
            }
        }

        function savePresets(presets) {
            localStorage.setItem(PRESETS_KEY, JSON.stringify(presets));
        }

        function updatePresetDropdown() {
            const select = document.getElementById('preset-select');
            const presets = loadPresets();
            const presetNames = Object.keys(presets).sort();

            select.innerHTML = '<option value="">-- 선택 --</option>' +
                presetNames.map(name => `<option value="${name}">${name}</option>`).join('');
        }

        function savePreset() {
            const name = prompt('프리셋 이름을 입력하세요:');
            if (!name || !name.trim()) return;

            const presets = loadPresets();
            presets[name.trim()] = getFilterState();
            savePresets(presets);
            updatePresetDropdown();

            document.getElementById('preset-select').value = name.trim();
            setStatus(`프리셋 '${name.trim()}' 저장됨`);
        }

        function loadPreset() {
            const select = document.getElementById('preset-select');
            const name = select.value;

            if (!name) {
                setStatus('프리셋을 선택하세요');
                return;
            }

            const presets = loadPresets();
            if (presets[name]) {
                setFilterState(presets[name]);
                setStatus(`프리셋 '${name}' 적용됨`);
            }
        }

        function deletePreset() {
            const select = document.getElementById('preset-select');
            const name = select.value;

            if (!name) {
                setStatus('삭제할 프리셋을 선택하세요');
                return;
            }

            if (!confirm(`프리셋 '${name}'을(를) 삭제하시겠습니까?`)) return;

            const presets = loadPresets();
            delete presets[name];
            savePresets(presets);
            updatePresetDropdown();
            setStatus(`프리셋 '${name}' 삭제됨`);
        }

        // ===== K8s API 함수 =====
        async function loadContexts() {
            setStatus('Context 로딩 중...');
            try {
                const res = await fetch('/api/k8s/contexts');
                const data = await res.json();
                const select = document.getElementById('context');
                const saved = loadSettings();

                select.innerHTML = data.contexts.map(c =>
                    `<option value="${c}"${c === (saved.context || data.current) ? ' selected' : ''}>${c}</option>`
                ).join('');
                setStatus(`Context ${data.contexts.length}개 로드됨`);
                if (data.contexts.length > 0) loadNamespaces();
            } catch (e) {
                setStatus('Context 로드 실패: ' + e.message);
            }
        }

        async function loadNamespaces() {
            const context = document.getElementById('context').value;
            setStatus('Namespace 로딩 중...');
            try {
                const res = await fetch(`/api/k8s/namespaces?context=${encodeURIComponent(context)}`);
                const data = await res.json();
                const select = document.getElementById('namespace');
                const saved = loadSettings();

                // 저장된 네임스페이스 또는 ums가 포함된 첫 네임스페이스 선택
                let defaultNs = saved.namespace || data.namespaces.find(n => n.includes('ums')) || 'default';
                if (!data.namespaces.includes(defaultNs)) {
                    defaultNs = data.namespaces[0] || 'default';
                }

                select.innerHTML = data.namespaces.map(n =>
                    `<option value="${n}"${n === defaultNs ? ' selected' : ''}>${n}</option>`
                ).join('');
                setStatus(`Namespace ${data.namespaces.length}개 로드됨`);
                saveSettings();
                if (data.namespaces.length > 0) loadPods();
            } catch (e) {
                setStatus('Namespace 로드 실패: ' + e.message);
            }
        }

        async function loadPods() {
            const context = document.getElementById('context').value;
            const namespace = document.getElementById('namespace').value;
            setStatus('Pod 로딩 중...');
            try {
                const res = await fetch(`/api/k8s/pods?context=${encodeURIComponent(context)}&namespace=${encodeURIComponent(namespace)}`);
                const data = await res.json();
                const saved = loadSettings();

                // Pod 검색 드롭다운에 데이터 설정
                podSearch.setItems(data.pods);

                // 저장된 pod 또는 첫번째 pod 선택
                let defaultPod = saved.pod;
                if (!defaultPod || !data.pods.find(p => p.name === defaultPod)) {
                    defaultPod = data.pods[0]?.name || '';
                }

                podSearch.setValue(defaultPod);
                setStatus(`Pod ${data.pods.length}개 로드됨 (키보드로 검색 가능)`);
                saveSettings();
            } catch (e) {
                setStatus('Pod 로드 실패: ' + e.message);
            }
        }

        async function connectPod() {
            const context = document.getElementById('context').value;
            const namespace = document.getElementById('namespace').value;
            const pod = document.getElementById('pod').value;

            if (!pod) {
                setStatus('Pod를 선택하세요');
                return;
            }

            // 기존 스트림 중지
            if (isStreaming) {
                stopStream();
            }

            saveSettings();
            setStatus(`Pod 로그 가져오는 중: ${pod}`);

            // 먼저 최근 로그 로드
            try {
                const url = `/api/k8s/logs?pod=${encodeURIComponent(pod)}&namespace=${encodeURIComponent(namespace)}&context=${encodeURIComponent(context)}&tail=500`;
                const res = await fetch(url);
                const data = await res.json();
                if (data.error) {
                    setStatus('오류: ' + data.error);
                    return;
                }
                await refreshLogs();
                setStatus(`Pod 로그 로드됨: ${pod} (${data.count}줄) - 실시간 스트리밍 시작...`);
            } catch (e) {
                setStatus('로그 가져오기 실패: ' + e.message);
                return;
            }

            // SSE 실시간 스트리밍 시작
            startStream(pod, namespace, context);
        }

        // ===== SSE 스트리밍 함수 =====
        function startStream(pod, namespace, context) {
            if (eventSource) {
                eventSource.close();
            }

            const url = `/api/k8s/logs/stream?pod=${encodeURIComponent(pod)}&namespace=${encodeURIComponent(namespace)}&context=${encodeURIComponent(context)}&tail=0`;
            eventSource = new EventSource(url);
            isStreaming = true;
            updateStreamingUI(true);

            eventSource.addEventListener('init', (e) => {
                const data = JSON.parse(e.data);
                streamId = data.streamId;
                setStatus(`🔴 실시간 스트리밍 중: ${data.pod} (Stream #${streamId})`);
            });

            eventSource.addEventListener('log', (e) => {
                const log = JSON.parse(e.data);
                addLogEntry(log);
            });

            eventSource.addEventListener('end', (e) => {
                const data = JSON.parse(e.data);
                setStatus(`스트리밍 종료: ${data.lines}줄 수신됨`);
                stopStream();
            });

            eventSource.addEventListener('error', (e) => {
                if (eventSource.readyState === EventSource.CLOSED) {
                    setStatus('스트리밍 연결 종료됨');
                    stopStream();
                }
            });

            eventSource.onerror = () => {
                if (isStreaming) {
                    setStatus('스트리밍 연결 끊김 - 재연결 중...');
                }
            };
        }

        function stopStream() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
            if (streamId) {
                fetch(`/api/k8s/logs/stream/stop?streamId=${streamId}`).catch(() => {});
                streamId = null;
            }
            isStreaming = false;
            updateStreamingUI(false);
        }

        function addLogEntry(log) {
            // 새 로그 추가
            allLogs.push({
                line: allLogs.length + 1,
                dateTime: log.dateTime,
                level: log.level,
                thread: log.thread,
                class: log.class,
                message: log.message,
                hasStackTrace: log.hasStackTrace,
                isBookmarked: false,
                isHighlighted: false
            });

            // 필터 적용 후 추가된 로그가 보이면 렌더링
            applyFilter();

            // 자동 스크롤
            if (autoScroll) {
                const container = document.querySelector('.log-table-container');
                container.scrollTop = container.scrollHeight;
            }

            // 상태 업데이트
            updateLogCount();
        }

        function updateStreamingUI(streaming) {
            const connectBtn = document.querySelector('button.primary[onclick="connectPod()"]');
            if (connectBtn) {
                if (streaming) {
                    connectBtn.textContent = '⏹ 중지';
                    connectBtn.onclick = stopStream;
                    connectBtn.style.backgroundColor = '#f44336';
                } else {
                    connectBtn.textContent = '연결';
                    connectBtn.onclick = connectPod;
                    connectBtn.style.backgroundColor = '';
                }
            }
        }

        function toggleAutoScroll() {
            autoScroll = !autoScroll;
            document.getElementById('auto-scroll-status').textContent =
                `자동스크롤: ${autoScroll ? 'ON' : 'OFF'}`;
        }

        // ===== 테마 관리 =====
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);

            const btn = document.getElementById('theme-toggle');
            btn.textContent = newTheme === 'dark' ? '☀️ 라이트' : '🌙 다크';
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);

            const btn = document.getElementById('theme-toggle');
            if (btn) {
                btn.textContent = savedTheme === 'dark' ? '☀️ 라이트' : '🌙 다크';
            }
        }

        // ===== 로그 관리 함수 =====
        async function loadSampleLogs() {
            setStatus('샘플 로딩 중...');
            const res = await fetch('/api/load');
            const data = await res.json();
            setStatus(`샘플 로그 로드됨: ${data.count}줄`);
            refreshLogs();
        }

        async function clearLogs() {
            await fetch('/api/clear');
            allLogs = [];
            filteredLogs = [];
            renderLogs([]);
            updateIndicator([]);
            setStatus('로그 클리어됨');
        }

        async function refreshLogs() {
            const res = await fetch('/api/logs');
            allLogs = await res.json();
            applyFilter();
        }

        // ===== 로그 다운로드 =====
        function downloadLogs() {
            const logsToDownload = filteredLogs.length > 0 ? filteredLogs : allLogs;

            if (logsToDownload.length === 0) {
                setStatus('다운로드할 로그가 없습니다');
                return;
            }

            // 로그를 텍스트로 변환
            const logText = logsToDownload.map(log => {
                const parts = [
                    log.dateTime || '',
                    log.level || '',
                    log.thread ? `[${log.thread}]` : '',
                    log.class || '',
                    log.message || ''
                ].filter(p => p).join(' ');
                return parts;
            }).join('\n');

            // 파일명 생성 (현재 시간 포함)
            const now = new Date();
            const timestamp = now.toISOString().replace(/[:.]/g, '-').slice(0, 19);
            const pod = document.getElementById('pod')?.value || 'logs';
            const filename = `${pod}-${timestamp}.log`;

            // Blob 생성 및 다운로드
            const blob = new Blob([logText], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            setStatus(`${logsToDownload.length}줄 다운로드됨: ${filename}`);
        }

        // ===== 필터 함수 =====
        function applyFilter() {
            const wordFind = document.getElementById('word-find-enabled')?.checked ?
                document.getElementById('word-find')?.value || '' : '';
            const wordRemove = document.getElementById('word-remove-enabled')?.checked ?
                document.getElementById('word-remove')?.value || '' : '';
            const classShow = document.getElementById('class-show-enabled')?.checked ?
                document.getElementById('class-show')?.value || '' : '';
            const classRemove = document.getElementById('class-remove-enabled')?.checked ?
                document.getElementById('class-remove')?.value || '' : '';
            const highlightKeyword = document.getElementById('highlight-enabled')?.checked ?
                document.getElementById('highlight-keyword')?.value || '' : '';

            // 로그 레벨 필터
            const enabledLevels = [];
            if (document.getElementById('level-verbose')?.checked) enabledLevels.push('TRACE');
            if (document.getElementById('level-debug')?.checked) enabledLevels.push('DEBUG');
            if (document.getElementById('level-info')?.checked) enabledLevels.push('INFO');
            if (document.getElementById('level-warn')?.checked) enabledLevels.push('WARN');
            if (document.getElementById('level-error')?.checked) enabledLevels.push('ERROR');
            if (document.getElementById('level-fatal')?.checked) enabledLevels.push('FATAL');

            // 모두 체크 해제시 모두 표시
            const showAllLevels = enabledLevels.length === 0;

            filteredLogs = allLogs.filter(log => {
                // 레벨 필터
                if (!showAllLevels && !enabledLevels.includes(log.level)) return false;

                // Word Find 필터
                if (wordFind) {
                    const keywords = wordFind.split('|').map(k => k.trim().toLowerCase()).filter(k => k);
                    const logText = (log.message + ' ' + log.class).toLowerCase();
                    if (!keywords.some(k => logText.includes(k))) return false;
                }

                // Word Remove 필터
                if (wordRemove) {
                    const keywords = wordRemove.split('|').map(k => k.trim().toLowerCase()).filter(k => k);
                    const logText = log.message.toLowerCase();
                    if (keywords.some(k => logText.includes(k))) return false;
                }

                // Class Show 필터
                if (classShow) {
                    const classes = classShow.split('|').map(c => c.trim().toLowerCase()).filter(c => c);
                    if (!classes.some(c => log.class.toLowerCase().includes(c))) return false;
                }

                // Class Remove 필터
                if (classRemove) {
                    const classes = classRemove.split('|').map(c => c.trim().toLowerCase()).filter(c => c);
                    if (classes.some(c => log.class.toLowerCase().includes(c))) return false;
                }

                return true;
            });

            // 하이라이트 키워드 마킹 및 인덱스 수집
            highlightedIndices = [];
            filteredLogs.forEach((log, index) => {
                log.isHighlighted = false;
                if (highlightKeyword) {
                    const keywords = highlightKeyword.split('|').map(k => k.trim().toLowerCase()).filter(k => k);
                    const logText = (log.message + ' ' + log.class).toLowerCase();
                    log.isHighlighted = keywords.some(k => logText.includes(k));
                    if (log.isHighlighted) {
                        highlightedIndices.push(index);
                    }
                }
            });

            // 하이라이트 카운트 업데이트
            updateHighlightCount();

            renderLogs(filteredLogs);
            updateIndicator(filteredLogs);
            updateLogCount();
        }

        // ===== 하이라이트 네비게이션 =====
        function updateHighlightCount() {
            const countEl = document.getElementById('highlight-count');
            if (!countEl) return;

            if (highlightedIndices.length === 0) {
                currentHighlightPos = -1;
                countEl.textContent = '0/0';
            } else {
                if (currentHighlightPos < 0) currentHighlightPos = 0;
                if (currentHighlightPos >= highlightedIndices.length) currentHighlightPos = highlightedIndices.length - 1;
                countEl.textContent = `${currentHighlightPos + 1}/${highlightedIndices.length}`;
            }
        }

        function navigateHighlight(direction) {
            if (highlightedIndices.length === 0) {
                setStatus('하이라이트된 항목이 없습니다');
                return;
            }

            currentHighlightPos += direction;

            // 순환 네비게이션
            if (currentHighlightPos < 0) {
                currentHighlightPos = highlightedIndices.length - 1;
            } else if (currentHighlightPos >= highlightedIndices.length) {
                currentHighlightPos = 0;
            }

            updateHighlightCount();

            // 해당 행으로 스크롤
            const targetIndex = highlightedIndices[currentHighlightPos];
            scrollToRow(targetIndex);
            selectRow(targetIndex);
        }

        function scrollToRow(index) {
            const container = document.querySelector('.log-table-container');
            if (!container) return;

            if (virtualScroll.enabled) {
                // 가상 스크롤 모드
                const scrollTop = index * virtualScroll.rowHeight - container.clientHeight / 2;
                container.scrollTop = Math.max(0, scrollTop);
            } else {
                // 일반 모드
                const row = container.querySelector(`tr[data-index="${index}"]`);
                if (row) {
                    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }

        function selectRow(index) {
            // 기존 선택 해제
            document.querySelectorAll('.log-table tr.selected').forEach(r => r.classList.remove('selected'));

            // 새 행 선택
            const row = document.querySelector(`.log-table tr[data-index="${index}"]`);
            if (row) {
                row.classList.add('selected');
            }
        }

        // ===== 렌더링 함수 (가상 스크롤 지원) =====
        function renderLogs(logs) {
            const container = document.querySelector('.log-table-container');
            const tbody = document.querySelector('.log-table tbody');

            // 가상 스크롤 사용 여부 결정
            virtualScroll.enabled = logs.length >= virtualScroll.threshold;

            if (!virtualScroll.enabled) {
                // 일반 렌더링 (1000줄 미만)
                renderAllRows(logs, tbody);
                return;
            }

            // 가상 스크롤 렌더링
            const totalHeight = logs.length * virtualScroll.rowHeight;
            const containerHeight = container.clientHeight;
            const visibleRows = Math.ceil(containerHeight / virtualScroll.rowHeight);

            // 스페이서 설정
            let spacer = container.querySelector('.virtual-scroll-spacer');
            if (!spacer) {
                spacer = document.createElement('div');
                spacer.className = 'virtual-scroll-spacer';
                container.insertBefore(spacer, container.firstChild);
            }
            spacer.style.height = totalHeight + 'px';

            // 초기 렌더링
            virtualScroll.visibleStart = 0;
            virtualScroll.visibleEnd = Math.min(visibleRows + virtualScroll.bufferSize * 2, logs.length);
            renderVisibleRows(logs, tbody, 0, virtualScroll.visibleEnd);

            // 스크롤 이벤트 핸들러
            container.onscroll = debounce(() => {
                if (!virtualScroll.enabled) return;

                const scrollTop = container.scrollTop;
                const startIndex = Math.max(0, Math.floor(scrollTop / virtualScroll.rowHeight) - virtualScroll.bufferSize);
                const endIndex = Math.min(logs.length, startIndex + visibleRows + virtualScroll.bufferSize * 2);

                // 변경이 필요한 경우만 다시 렌더링
                if (startIndex !== virtualScroll.visibleStart || endIndex !== virtualScroll.visibleEnd) {
                    virtualScroll.visibleStart = startIndex;
                    virtualScroll.visibleEnd = endIndex;
                    renderVisibleRows(logs, tbody, startIndex, endIndex);
                }
            }, 16);
        }

        function renderAllRows(logs, tbody) {
            const highlightKeyword = document.getElementById('highlight-enabled')?.checked ?
                document.getElementById('highlight-keyword')?.value || '' : '';

            tbody.innerHTML = logs.map((log, index) => renderRow(log, index, highlightKeyword)).join('');
            attachRowEvents();
        }

        function renderVisibleRows(logs, tbody, startIndex, endIndex) {
            const highlightKeyword = document.getElementById('highlight-enabled')?.checked ?
                document.getElementById('highlight-keyword')?.value || '' : '';

            // 상단 패딩 행
            const topPadding = startIndex * virtualScroll.rowHeight;
            // 하단 패딩
            const bottomPadding = (logs.length - endIndex) * virtualScroll.rowHeight;

            let html = '';
            // 상단 패딩 (빈 행)
            if (topPadding > 0) {
                html += `<tr style="height: ${topPadding}px;"><td colspan="7"></td></tr>`;
            }

            // 실제 보이는 행 렌더링
            for (let i = startIndex; i < endIndex; i++) {
                html += renderRow(logs[i], i, highlightKeyword);
            }

            // 하단 패딩 (빈 행)
            if (bottomPadding > 0) {
                html += `<tr style="height: ${bottomPadding}px;"><td colspan="7"></td></tr>`;
            }

            tbody.innerHTML = html;
            attachRowEvents();
        }

        function renderRow(log, index, highlightKeyword) {
            let rowClass = '';
            if (log.isBookmarked) rowClass = 'log-row-bookmark';
            else if (log.isHighlighted) rowClass = 'log-row-highlight';
            else if (log.level === 'ERROR' || log.level === 'FATAL') rowClass = 'log-row-error';
            else if (log.level === 'WARN') rowClass = 'log-row-warn';

            let message = escapeHtml(log.message);
            // 하이라이트 키워드 강조
            if (highlightKeyword) {
                const keywords = highlightKeyword.split('|').map(k => k.trim()).filter(k => k);
                keywords.forEach(keyword => {
                    const regex = new RegExp(`(${escapeRegex(keyword)})`, 'gi');
                    message = message.replace(regex, '<span class="keyword-match">$1</span>');
                });
            }

            return `<tr class="${rowClass}" data-index="${index}" style="height: ${virtualScroll.rowHeight}px;">
                <td class="col-bookmark">${log.isBookmarked ? '★' : ''}</td>
                <td class="col-line">${log.line}</td>
                <td class="col-datetime">${log.dateTime}</td>
                <td class="col-level level-${log.level}">${log.level}</td>
                <td class="col-thread">${escapeHtml(log.thread)}</td>
                <td class="col-class">${escapeHtml(log.class)}</td>
                <td class="col-message">${message}</td>
            </tr>`;
        }

        function updateIndicator(logs) {
            const leftContainer = document.querySelector('.indicator-left');
            const rightContainer = document.querySelector('.indicator-right');

            if (!leftContainer || !rightContainer) return;

            leftContainer.innerHTML = '';
            rightContainer.innerHTML = '';

            if (logs.length === 0) return;

            logs.forEach((log, index) => {
                const percent = (index / logs.length) * 100;

                // 좌측: 하이라이트/북마크
                if (log.isHighlighted) {
                    leftContainer.innerHTML += `<div class="indicator-marker highlight" style="top: ${percent}%;"></div>`;
                } else if (log.isBookmarked) {
                    leftContainer.innerHTML += `<div class="indicator-marker bookmark" style="top: ${percent}%;"></div>`;
                }

                // 우측: 에러/경고
                if (log.level === 'ERROR' || log.level === 'FATAL') {
                    rightContainer.innerHTML += `<div class="indicator-marker error" style="top: ${percent}%;"></div>`;
                } else if (log.level === 'WARN') {
                    rightContainer.innerHTML += `<div class="indicator-marker warn" style="top: ${percent}%;"></div>`;
                }
            });
        }

        function updateLogCount() {
            const countSpan = document.querySelector('.log-count strong');
            if (countSpan) {
                countSpan.textContent = filteredLogs.length.toLocaleString();
            }
            setStatus(`표시: ${filteredLogs.length}/${allLogs.length}줄`);
        }

        // ===== 유틸리티 함수 =====
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function escapeRegex(str) {
            return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function setStatus(msg) {
            const statusSpan = document.querySelector('.statusbar span:first-child');
            if (statusSpan) statusSpan.textContent = msg;
        }

        // ===== 행 이벤트 =====
        function attachRowEvents() {
            document.querySelectorAll('.log-table tbody tr').forEach(row => {
                row.addEventListener('click', function(e) {
                    if (!e.ctrlKey) {
                        document.querySelectorAll('.log-table tbody tr.selected').forEach(r => {
                            r.classList.remove('selected');
                        });
                    }
                    this.classList.toggle('selected');
                });

                row.addEventListener('dblclick', function() {
                    const index = parseInt(this.dataset.index);
                    if (filteredLogs[index]) {
                        filteredLogs[index].isBookmarked = !filteredLogs[index].isBookmarked;
                        applyFilter();
                    }
                });
            });
        }

        // ===== 초기화 =====
        function setupEventListeners() {
            // Pod 검색 드롭다운 초기화
            podSearch.init();

            // Context/Namespace 변경
            document.getElementById('context')?.addEventListener('change', () => {
                saveSettings();
                loadNamespaces();
            });
            document.getElementById('namespace')?.addEventListener('change', () => {
                saveSettings();
                loadPods();
            });

            // 필터 변경 시 자동 적용
            document.querySelectorAll('.filter-group-box input').forEach(input => {
                input.addEventListener('change', applyFilter);
                input.addEventListener('input', debounce(applyFilter, 300));
            });

            // 로그 레벨 체크박스
            document.querySelectorAll('.level-checkbox input').forEach(checkbox => {
                checkbox.addEventListener('change', applyFilter);
            });

            // 개별 필터 체크박스 토글
            document.querySelectorAll('.filter-row input[type="checkbox"]').forEach(checkbox => {
                checkbox.addEventListener('change', function() {
                    const row = this.closest('.filter-row');
                    const textInput = row.querySelector('input[type="text"]');
                    if (textInput) {
                        textInput.disabled = !this.checked;
                        textInput.style.opacity = this.checked ? '1' : '0.5';
                    }
                    applyFilter();
                });
            });

            // Font Size 적용
            document.getElementById('font-apply')?.addEventListener('click', () => {
                const fontSize = document.getElementById('font-size')?.value || 12;
                document.querySelector('.log-table').style.fontSize = fontSize + 'px';
            });

            // Goto 라인
            document.getElementById('goto-line')?.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const line = parseInt(e.target.value);
                    if (line) {
                        const row = document.querySelector(`.log-table tbody tr[data-index="${line - 1}"]`);
                        if (row) {
                            row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            row.classList.add('selected');
                        }
                    }
                }
            });

            // 인디케이터 클릭으로 스크롤
            document.querySelector('.indicator-canvas')?.addEventListener('click', (e) => {
                const rect = e.currentTarget.getBoundingClientRect();
                const percent = (e.clientY - rect.top) / rect.height;
                const index = Math.floor(percent * filteredLogs.length);
                const row = document.querySelector(`.log-table tbody tr[data-index="${index}"]`);
                if (row) {
                    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    document.querySelectorAll('.log-table tbody tr.selected').forEach(r => r.classList.remove('selected'));
                    row.classList.add('selected');
                }
            });

            // 전역 키보드 단축키
            document.addEventListener('keydown', (e) => {
                // F3: 다음 하이라이트
                if (e.key === 'F3' && !e.shiftKey) {
                    e.preventDefault();
                    navigateHighlight(1);
                }
                // Shift+F3: 이전 하이라이트
                else if (e.key === 'F3' && e.shiftKey) {
                    e.preventDefault();
                    navigateHighlight(-1);
                }
                // Ctrl+G: Goto 라인으로 포커스
                else if (e.key === 'g' && e.ctrlKey) {
                    e.preventDefault();
                    document.getElementById('goto-line')?.focus();
                }
                // Escape: 하이라이트 키워드 입력창 초기화
                else if (e.key === 'Escape') {
                    const activeEl = document.activeElement;
                    if (activeEl?.tagName === 'INPUT') {
                        activeEl.blur();
                    }
                }
            });
        }

        function debounce(func, wait) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }

        // 페이지 로드 시 초기화
        window.onload = function() {
            loadTheme();  // 테마 먼저 로드
            updatePresetDropdown();  // 프리셋 드롭다운 초기화
            setupEventListeners();
            loadContexts();

            // 초기 로그 테이블 비우기
            document.querySelector('.log-table tbody').innerHTML =
                '<tr><td colspan="7" style="text-align:center; padding: 20px; color: var(--text-muted);">Pod를 선택하고 연결하세요</td></tr>';
        };
    </script>

</body>
