<!DOCTYPE html>
<html lang="ko" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K8s Log Viewer v2.0 - Tailwind</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        // 로그 레벨 색상
                        'level-trace': '#808080',
                        'level-debug': '#0066cc',
                        'level-info': '#2e8b57',
                        'level-warn': '#ff9a00',
                        'level-error': '#ff0000',
                        'level-fatal': '#cc0000',
                        // 커스텀 색상
                        'highlight-bg': '#FFFF99',
                        'highlight-bg-dark': '#4a4a00',
                        'bookmark-bg': '#E3F2FD',
                        'bookmark-bg-dark': '#0d3a58',
                        'error-bg': '#FFEBEE',
                        'error-bg-dark': '#3a1515',
                        'warn-bg': '#FFF8E1',
                        'warn-bg-dark': '#3a3515',
                    }
                }
            }
        }
    </script>
    <style>
        /* 로그 레벨 색상 */
        .level-TRACE { color: #808080; }
        .level-DEBUG { color: #0066cc; }
        .level-INFO { color: #2e8b57; }
        .level-WARN { color: #ff9a00; }
        .level-ERROR { color: #ff0000; }
        .level-FATAL { color: #cc0000; }

        /* 로그 행 특수 배경 */
        .log-row-highlight { background-color: #FFFF99 !important; }
        .dark .log-row-highlight { background-color: #4a4a00 !important; }
        .log-row-bookmark { background-color: #E3F2FD !important; }
        .dark .log-row-bookmark { background-color: #0d3a58 !important; }
        .log-row-error { background-color: #FFEBEE !important; }
        .dark .log-row-error { background-color: #3a1515 !important; }
        .log-row-warn { background-color: #FFF8E1 !important; }
        .dark .log-row-warn { background-color: #3a3515 !important; }

        /* 키워드 하이라이트 */
        .keyword-match {
            color: #FF6600;
            font-weight: bold;
        }

        /* Word Filter 매칭 하이라이트 */
        .word-filter-match {
            color: #16a34a;
            font-weight: bold;
            background-color: rgba(22, 163, 74, 0.15);
            padding: 0 2px;
            border-radius: 2px;
        }
        .dark .word-filter-match {
            background-color: rgba(22, 163, 74, 0.25);
        }

        /* 선택된 행 (포커스) - 최상위 우선순위 */
        .log-row-selected {
            background-color: #3B82F6 !important;
            color: white !important;
        }
        .log-row-selected td {
            color: white !important;
        }
        .dark .log-row-selected {
            background-color: #1D4ED8 !important;
        }

        /* JSON 데이터 포맷팅 */
        .json-preview {
            max-width: 600px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: pointer;
        }
        .json-preview:hover {
            text-decoration: underline;
        }
        .json-expanded {
            white-space: pre-wrap;
            word-break: break-all;
            background-color: #f5f5f5;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 11px;
            max-height: 300px;
            overflow-y: auto;
        }
        .dark .json-expanded {
            background-color: #1f2937;
        }

        /* 필터 입력 컬러링 */
        #word-find:not(:placeholder-shown) {
            color: #16a34a;
            font-weight: 600;
        }
        #word-find.filter-disabled {
            color: #9ca3af !important;
            font-weight: normal !important;
            text-decoration: line-through;
        }
        #word-remove:not(:placeholder-shown) {
            color: #dc2626;
            font-weight: 600;
        }
        #word-remove.filter-disabled {
            color: #9ca3af !important;
            font-weight: normal !important;
            text-decoration: line-through;
        }
        #class-show:not(:placeholder-shown) {
            color: #2563eb;
            font-weight: 600;
        }
        #class-show.filter-disabled {
            color: #9ca3af !important;
            font-weight: normal !important;
            text-decoration: line-through;
        }
        #class-remove:not(:placeholder-shown) {
            color: #dc2626;
            font-weight: 600;
        }
        #class-remove.filter-disabled {
            color: #9ca3af !important;
            font-weight: normal !important;
            text-decoration: line-through;
        }
        #highlight-keyword:not(:placeholder-shown) {
            color: #ea580c;
            font-weight: 600;
            background-color: #fef3c7;
        }
        #highlight-keyword.filter-disabled {
            color: #9ca3af !important;
            font-weight: normal !important;
            background-color: transparent !important;
            text-decoration: line-through;
        }
        .dark #highlight-keyword:not(:placeholder-shown) {
            background-color: #422006;
        }

        /* 가상 스크롤 스페이서 */
        .virtual-scroll-spacer {
            width: 100%;
            pointer-events: none;
        }

        /* 검색어 입력 팝업 */
        .search-popup {
            display: none;
        }
        .search-popup.visible {
            display: block;
            animation: popup-fade 0.15s ease-out;
        }
        @keyframes popup-fade {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        /* 드롭다운 화살표 */
        .searchable-dropdown-trigger::after {
            content: '▼';
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 10px;
        }

        /* 드롭다운 항목 숨김 */
        .searchable-dropdown-item.hidden {
            display: none;
        }

        /* 검색 매칭 하이라이트 */
        .searchable-dropdown-item .match {
            background-color: #FFFF00;
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 h-screen flex flex-col transition-colors duration-300">

    <!-- 메뉴바 -->
    <div class="bg-gray-200 dark:bg-gray-800 border-b border-gray-300 dark:border-gray-700 px-2 py-1 flex justify-between items-center">
        <div class="flex gap-4">
            <span class="px-3 py-1 cursor-pointer rounded hover:bg-gray-300 dark:hover:bg-gray-700 text-sm">파일</span>
            <span class="px-3 py-1 cursor-pointer rounded hover:bg-gray-300 dark:hover:bg-gray-700 text-sm">편집</span>
            <span class="px-3 py-1 cursor-pointer rounded hover:bg-gray-300 dark:hover:bg-gray-700 text-sm">보기</span>
            <span class="px-3 py-1 cursor-pointer rounded hover:bg-gray-300 dark:hover:bg-gray-700 text-sm">도움말</span>
        </div>
        <button onclick="toggleTheme()" id="theme-toggle"
            class="px-3 py-1 border border-gray-400 dark:border-gray-600 rounded text-sm hover:bg-gray-300 dark:hover:bg-gray-700 transition-colors">
            🌙 다크
        </button>
    </div>

    <!-- K8s 선택 패널 -->
    <div class="bg-gray-50 dark:bg-gray-800 border-b border-gray-300 dark:border-gray-700 p-2">
        <div class="flex items-center gap-3 flex-wrap mb-2">
            <label class="text-sm font-medium">Context:</label>
            <select id="context" class="px-2 py-1 border border-gray-300 dark:border-gray-600 rounded text-sm bg-white dark:bg-gray-700 min-w-[150px]">
                <option value="">-- 로딩 중 --</option>
            </select>

            <label class="text-sm font-medium">Namespace:</label>
            <select id="namespace" class="px-2 py-1 border border-gray-300 dark:border-gray-600 rounded text-sm bg-white dark:bg-gray-700 min-w-[150px]">
                <option value="">-- Context 선택 --</option>
            </select>

            <button onclick="loadContexts()" class="px-3 py-1 border border-gray-300 dark:border-gray-600 rounded text-sm hover:bg-gray-200 dark:hover:bg-gray-700 bg-white dark:bg-gray-700">
                새로고침
            </button>
        </div>
        <div class="flex items-center gap-3 flex-wrap">
            <label class="text-sm font-medium">Pod:</label>
            <div class="searchable-dropdown relative inline-block" id="pod-dropdown">
                <button type="button" id="pod-trigger"
                    class="searchable-dropdown-trigger min-w-[350px] px-2 py-1 pr-7 border border-gray-300 dark:border-gray-600 rounded text-sm bg-white dark:bg-gray-700 text-left truncate relative focus:outline-none focus:ring-2 focus:ring-green-500">
                    -- Pod 선택 --
                </button>
                <div id="pod-list" class="absolute top-full left-0 right-0 max-h-[300px] overflow-y-auto bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 border-t-0 rounded-b z-50 hidden shadow-lg">
                </div>
            </div>
            <input type="hidden" id="pod" value="">

            <label class="text-sm font-medium">Container:</label>
            <select id="container" class="px-2 py-1 border border-gray-300 dark:border-gray-600 rounded text-sm bg-white dark:bg-gray-700">
                <option value="">-</option>
            </select>

            <button onclick="connectPod()" class="px-4 py-1 bg-green-600 hover:bg-green-700 text-white rounded text-sm font-medium transition-colors">
                연결
            </button>
        </div>
    </div>

    <!-- 필터 패널 -->
    <div class="bg-gray-50 dark:bg-gray-800 border-b border-gray-300 dark:border-gray-700 p-2">
        <div class="flex items-start gap-3 flex-wrap">
            <!-- Presets -->
            <fieldset class="border border-gray-300 dark:border-gray-600 rounded p-2 bg-white dark:bg-gray-700">
                <legend class="text-xs font-semibold text-gray-600 dark:text-gray-400 px-1">Presets</legend>
                <div class="flex items-center gap-1">
                    <select id="preset-select" class="w-28 px-1 py-0.5 border border-gray-300 dark:border-gray-600 rounded text-xs bg-white dark:bg-gray-600">
                        <option value="">-- 선택 --</option>
                    </select>
                    <button onclick="loadPreset()" title="프리셋 적용" class="px-2 py-0.5 border border-gray-300 dark:border-gray-600 rounded text-xs hover:bg-gray-100 dark:hover:bg-gray-600 bg-white dark:bg-gray-700">적용</button>
                    <button onclick="savePreset()" title="현재 필터 저장" class="px-2 py-0.5 border border-gray-300 dark:border-gray-600 rounded text-xs hover:bg-gray-100 dark:hover:bg-gray-600 bg-white dark:bg-gray-700">저장</button>
                    <button onclick="deletePreset()" title="프리셋 삭제" class="px-2 py-0.5 border border-gray-300 dark:border-gray-600 rounded text-xs hover:bg-gray-100 dark:hover:bg-gray-600 bg-white dark:bg-gray-700 text-red-500">삭제</button>
                </div>
            </fieldset>

            <!-- Word Filter -->
            <fieldset class="border border-gray-300 dark:border-gray-600 rounded p-2 bg-white dark:bg-gray-700">
                <legend class="text-xs font-semibold text-gray-600 dark:text-gray-400 px-1">Word filter</legend>
                <div class="flex flex-col gap-1">
                    <div class="flex items-center gap-2">
                        <label class="text-xs w-14">Find:</label>
                        <input type="text" id="word-find" placeholder="검색어 (| 로 구분)" class="w-48 px-2 py-0.5 border border-gray-300 dark:border-gray-600 rounded text-xs bg-white dark:bg-gray-600">
                        <input type="checkbox" id="word-find-enabled" checked class="w-4 h-4" title="Find 필터 활성화">
                    </div>
                    <div class="flex items-center gap-2">
                        <label class="text-xs w-14">Remove:</label>
                        <input type="text" id="word-remove" placeholder="제외어 (| 로 구분)" class="w-48 px-2 py-0.5 border border-gray-300 dark:border-gray-600 rounded text-xs bg-white dark:bg-gray-600">
                        <input type="checkbox" id="word-remove-enabled" checked class="w-4 h-4" title="Remove 필터 활성화">
                    </div>
                </div>
            </fieldset>

            <!-- Class Filter -->
            <fieldset class="border border-gray-300 dark:border-gray-600 rounded p-2 bg-white dark:bg-gray-700">
                <legend class="text-xs font-semibold text-gray-600 dark:text-gray-400 px-1">Class filter</legend>
                <div class="flex flex-col gap-1">
                    <div class="flex items-center gap-2">
                        <label class="text-xs w-14">Show:</label>
                        <input type="text" id="class-show" placeholder="표시할 클래스" class="w-32 px-2 py-0.5 border border-gray-300 dark:border-gray-600 rounded text-xs bg-white dark:bg-gray-600">
                        <input type="checkbox" id="class-show-enabled" checked class="w-4 h-4" title="Show 필터 활성화">
                    </div>
                    <div class="flex items-center gap-2">
                        <label class="text-xs w-14">Remove:</label>
                        <input type="text" id="class-remove" placeholder="제외할 클래스" class="w-32 px-2 py-0.5 border border-gray-300 dark:border-gray-600 rounded text-xs bg-white dark:bg-gray-600">
                        <input type="checkbox" id="class-remove-enabled" checked class="w-4 h-4" title="Remove 필터 활성화">
                    </div>
                </div>
            </fieldset>

            <!-- Highlight -->
            <fieldset class="border border-gray-300 dark:border-gray-600 rounded p-2 bg-white dark:bg-gray-700">
                <legend class="text-xs font-semibold text-gray-600 dark:text-gray-400 px-1">Highlight</legend>
                <div class="flex items-center gap-2">
                    <label class="text-xs">Keyword:</label>
                    <input type="text" id="highlight-keyword" placeholder="하이라이트 키워드" class="w-28 px-2 py-0.5 border border-gray-300 dark:border-gray-600 rounded text-xs bg-white dark:bg-gray-600">
                    <input type="checkbox" id="highlight-enabled" checked class="w-4 h-4" title="하이라이트 활성화">
                    <span id="highlight-count" class="text-xs text-gray-500 dark:text-gray-400 min-w-[40px]">0/0</span>
                    <button id="highlight-prev" onclick="navigateHighlight(-1)" title="이전 (Shift+F3)" class="px-1.5 py-0.5 border border-gray-300 dark:border-gray-600 rounded text-xs hover:bg-gray-100 dark:hover:bg-gray-600 bg-white dark:bg-gray-700">▲</button>
                    <button id="highlight-next" onclick="navigateHighlight(1)" title="다음 (F3)" class="px-1.5 py-0.5 border border-gray-300 dark:border-gray-600 rounded text-xs hover:bg-gray-100 dark:hover:bg-gray-600 bg-white dark:bg-gray-700">▼</button>
                </div>
            </fieldset>

            <!-- Log Level Filter -->
            <fieldset class="border border-gray-300 dark:border-gray-600 rounded p-2 bg-white dark:bg-gray-700">
                <legend class="text-xs font-semibold text-gray-600 dark:text-gray-400 px-1">Log filter</legend>
                <div class="flex items-center gap-3">
                    <label class="flex items-center gap-1 text-xs">
                        <input type="checkbox" id="level-verbose" checked class="w-3 h-3">
                        <span class="level-TRACE">Verbose</span>
                    </label>
                    <label class="flex items-center gap-1 text-xs">
                        <input type="checkbox" id="level-debug" checked class="w-3 h-3">
                        <span class="level-DEBUG">Debug</span>
                    </label>
                    <label class="flex items-center gap-1 text-xs">
                        <input type="checkbox" id="level-info" checked class="w-3 h-3">
                        <span class="level-INFO">Info</span>
                    </label>
                    <label class="flex items-center gap-1 text-xs">
                        <input type="checkbox" id="level-warn" checked class="w-3 h-3">
                        <span class="level-WARN">Warn</span>
                    </label>
                    <label class="flex items-center gap-1 text-xs">
                        <input type="checkbox" id="level-error" checked class="w-3 h-3">
                        <span class="level-ERROR">Error</span>
                    </label>
                    <label class="flex items-center gap-1 text-xs">
                        <input type="checkbox" id="level-fatal" checked class="w-3 h-3">
                        <span class="level-FATAL">Fatal</span>
                    </label>
                </div>
            </fieldset>

            <!-- Font Settings -->
            <fieldset class="border border-gray-300 dark:border-gray-600 rounded p-2 bg-white dark:bg-gray-700">
                <legend class="text-xs font-semibold text-gray-600 dark:text-gray-400 px-1">Font</legend>
                <div class="flex items-center gap-2">
                    <label class="text-xs">Size:</label>
                    <input type="number" id="font-size" value="12" min="8" max="24" class="w-12 px-1 py-0.5 border border-gray-300 dark:border-gray-600 rounded text-xs bg-white dark:bg-gray-600">
                    <button id="font-apply" class="px-2 py-0.5 border border-gray-300 dark:border-gray-600 rounded text-xs hover:bg-gray-100 dark:hover:bg-gray-600 bg-white dark:bg-gray-700">OK</button>
                    <label class="text-xs ml-2">Goto:</label>
                    <input type="text" id="goto-line" placeholder="" class="w-14 px-1 py-0.5 border border-gray-300 dark:border-gray-600 rounded text-xs bg-white dark:bg-gray-600">
                </div>
            </fieldset>
        </div>
    </div>

    <!-- 컨트롤 패널 -->
    <div class="bg-gray-100 dark:bg-gray-800 border-b border-gray-300 dark:border-gray-700 p-2">
        <div class="flex items-center gap-3">
            <span class="text-sm font-semibold">로그: <strong id="log-count-value">0</strong>줄</span>
            <button id="connect-btn" onclick="connectPod()" class="px-3 py-1 bg-green-600 hover:bg-green-700 text-white rounded text-sm transition-colors">▶ 시작</button>
            <button onclick="loadSampleLogs()" class="px-3 py-1 border border-gray-300 dark:border-gray-600 rounded text-sm hover:bg-gray-200 dark:hover:bg-gray-700 bg-white dark:bg-gray-700">📥 샘플 로드</button>
            <button onclick="downloadLogs()" class="px-3 py-1 border border-gray-300 dark:border-gray-600 rounded text-sm hover:bg-gray-200 dark:hover:bg-gray-700 bg-white dark:bg-gray-700">💾 다운로드</button>
            <button onclick="clearLogs()" class="px-3 py-1 bg-red-500 hover:bg-red-600 text-white rounded text-sm transition-colors">🗑 클리어</button>
        </div>
    </div>

    <!-- 메인 영역 -->
    <div class="flex flex-1 overflow-hidden">
        <!-- 인디케이터 패널 -->
        <div class="w-16 bg-gray-800 dark:bg-gray-900 border-r border-gray-600 flex flex-col p-1">
            <div class="flex justify-center gap-1 mb-1 text-xs">
                <label class="flex items-center gap-0.5" title="북마크 표시">
                    <input type="checkbox" checked class="w-3 h-3">
                    <span class="text-yellow-400">★</span>
                </label>
                <label class="flex items-center gap-0.5" title="에러 표시">
                    <input type="checkbox" checked class="w-3 h-3">
                    <span class="text-red-400">E</span>
                </label>
            </div>
            <div class="flex-1 flex gap-0.5">
                <div class="indicator-left flex-1 bg-gray-700 dark:bg-gray-800 rounded relative"></div>
                <div class="indicator-right flex-1 bg-gray-700 dark:bg-gray-800 rounded relative"></div>
            </div>
        </div>

        <!-- 로그 테이블 -->
        <div class="log-table-container flex-1 overflow-auto bg-white dark:bg-gray-900 relative">
            <table class="log-table w-full border-collapse text-xs">
                <thead class="sticky top-0 z-10">
                    <tr class="bg-gray-200 dark:bg-gray-800">
                        <th class="w-8 text-center py-2 px-1 border-b-2 border-gray-300 dark:border-gray-600 font-semibold text-yellow-500">★</th>
                        <th class="w-44 text-left py-2 px-1 border-b-2 border-gray-300 dark:border-gray-600 font-semibold">DateTime</th>
                        <th class="w-14 text-center py-2 px-1 border-b-2 border-gray-300 dark:border-gray-600 font-semibold">Level</th>
                        <th class="w-36 text-left py-2 px-1 border-b-2 border-gray-300 dark:border-gray-600 font-semibold text-purple-600 dark:text-purple-400">Thread</th>
                        <th class="w-48 text-left py-2 px-1 border-b-2 border-gray-300 dark:border-gray-600 font-semibold text-green-700 dark:text-green-400">Class</th>
                        <th class="min-w-[400px] text-left py-2 px-1 border-b-2 border-gray-300 dark:border-gray-600 font-semibold">Message</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="6" class="text-center py-5 text-gray-500 dark:text-gray-400">Pod를 선택하고 연결하세요</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 상태바 -->
    <div class="bg-gray-200 dark:bg-gray-800 border-t border-gray-300 dark:border-gray-600 px-3 py-1 flex justify-between text-xs text-gray-600 dark:text-gray-400">
        <span id="status-text">준비됨</span>
        <div class="flex gap-5">
            <span id="auto-scroll-status" onclick="toggleAutoScroll()" class="cursor-pointer hover:text-gray-800 dark:hover:text-gray-200">자동스크롤: ON</span>
            <span id="display-count">표시: 0줄</span>
        </div>
    </div>

    <!-- 검색어 입력 팝업 -->
    <div class="search-popup fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-black/85 text-white px-6 py-4 rounded-lg text-2xl font-bold tracking-wide z-[2000] min-w-[100px] text-center shadow-2xl" id="search-popup">
        <span class="text-green-500" id="search-text"></span>
        <div class="text-xs text-gray-400 mt-2 tracking-normal">ESC: 취소 / Enter: 선택</div>
    </div>

    <script>
        // ===== 전역 상태 =====
        let allLogs = [];
        let filteredLogs = [];
        let podList = [];
        let eventSource = null;
        let streamId = null;
        let isStreaming = false;
        let autoScroll = true;

        // 테스트용 전역 노출
        window.allLogs = allLogs;
        window.filteredLogs = filteredLogs;

        // 하이라이트 네비게이션 상태
        let highlightedIndices = [];
        let currentHighlightPos = -1;

        // 선택된 행 상태 (index 기반으로 유지)
        let selectedLogIndex = -1;

        // 가상 스크롤 설정
        const virtualScroll = {
            rowHeight: 28,
            bufferSize: 20,
            visibleStart: 0,
            visibleEnd: 0,
            enabled: true,
            threshold: 1000
        };

        // ===== DOM 풀 재사용 =====
        const rowPool = {
            rows: [],           // 실제 TR 요소들
            poolSize: 100,      // 풀 크기 (뷰포트 + 버퍼)
            initialized: false,
            topPaddingRow: null,
            bottomPaddingRow: null,

            // 풀 초기화
            init(tbody) {
                if (this.initialized) return;

                // 상단 패딩 행
                this.topPaddingRow = document.createElement('tr');
                this.topPaddingRow.innerHTML = '<td colspan="6"></td>';
                this.topPaddingRow.style.height = '0px';
                this.topPaddingRow.classList.add('pool-padding-top');

                // 데이터 행들 생성
                for (let i = 0; i < this.poolSize; i++) {
                    const row = this.createEmptyRow();
                    row.style.display = 'none';
                    this.rows.push(row);
                }

                // 하단 패딩 행
                this.bottomPaddingRow = document.createElement('tr');
                this.bottomPaddingRow.innerHTML = '<td colspan="6"></td>';
                this.bottomPaddingRow.style.height = '0px';
                this.bottomPaddingRow.classList.add('pool-padding-bottom');

                // tbody에 추가
                tbody.innerHTML = '';
                tbody.appendChild(this.topPaddingRow);
                this.rows.forEach(row => tbody.appendChild(row));
                tbody.appendChild(this.bottomPaddingRow);

                this.initialized = true;
            },

            // 빈 TR 요소 생성
            createEmptyRow() {
                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-100 dark:hover:bg-gray-800 border-b border-gray-200 dark:border-gray-700';
                row.style.height = virtualScroll.rowHeight + 'px';
                row.innerHTML = `
                    <td class="w-8 text-center text-yellow-500 cell-bookmark"></td>
                    <td class="w-44 px-1 cell-datetime"></td>
                    <td class="w-14 text-center font-bold cell-level"></td>
                    <td class="w-36 px-1 text-purple-600 dark:text-purple-400 truncate cell-thread"></td>
                    <td class="w-48 px-1 text-green-700 dark:text-green-400 truncate cell-class"></td>
                    <td class="min-w-[400px] px-1 cell-message"></td>
                `;
                return row;
            },

            // 행 데이터 업데이트 (DOM 생성 없음)
            updateRow(row, log, index, highlightKeyword) {
                row.dataset.index = index;
                row.style.display = '';

                // 행 클래스 업데이트
                row.className = 'border-b border-gray-200 dark:border-gray-700';

                // 선택된 행 상태 유지 (최우선)
                if (index === selectedLogIndex) {
                    row.classList.add('log-row-selected');
                } else if (log.isBookmarked) {
                    row.classList.add('log-row-bookmark');
                } else if (log.isHighlighted) {
                    row.classList.add('log-row-highlight');
                } else if (log.level === 'ERROR' || log.level === 'FATAL') {
                    row.classList.add('log-row-error');
                } else if (log.level === 'WARN') {
                    row.classList.add('log-row-warn');
                } else {
                    row.classList.add('hover:bg-gray-100', 'dark:hover:bg-gray-800');
                }

                // 셀 업데이트 (textContent 사용 - innerHTML보다 빠름)
                row.querySelector('.cell-bookmark').textContent = log.isBookmarked ? '★' : '';
                row.querySelector('.cell-datetime').textContent = log.dateTime || '';

                const levelCell = row.querySelector('.cell-level');
                levelCell.textContent = log.level || '';
                levelCell.className = 'w-14 text-center font-bold cell-level level-' + (log.level || 'INFO');

                row.querySelector('.cell-thread').textContent = log.thread || '';
                row.querySelector('.cell-class').textContent = log.class || '';

                // 메시지는 하이라이트 때문에 innerHTML 사용 (필요시만)
                const msgCell = row.querySelector('.cell-message');
                if (highlightKeyword || this.hasWordFilter()) {
                    msgCell.innerHTML = formatMessage(log.message || '', highlightKeyword);
                } else {
                    msgCell.textContent = log.message || '';

            // Word Filter 활성화 여부
            hasWordFilter() {
                const wordFindInput = document.getElementById('word-find');
                return wordFindInput && wordFindInput.value.trim() !== '';

            // 행 숨기기
            hideRow(row) {

            // 패딩 업데이트
            updatePadding(topHeight, bottomHeight) {
                this.topPaddingRow.style.height = topHeight + 'px';
                this.bottomPaddingRow.style.height = bottomHeight + 'px';

        // ===== Pod 검색 드롭다운 =====
        const podSearch = {
            searchText: '',
            isOpen: false,
            highlightedIndex: -1,
            hideTimeout: null,

            init() {
                const trigger = document.getElementById('pod-trigger');
                const list = document.getElementById('pod-list');

                trigger.addEventListener('click', () => this.toggle());
                trigger.addEventListener('keydown', (e) => this.handleKeydown(e));

                document.addEventListener('click', (e) => {
                    if (!e.target.closest('#pod-dropdown')) {
                        this.close();
                    }
                });
            },

            toggle() {
                if (this.isOpen) {
                    this.close();
                } else {
                    this.open();
                }
            },

            open() {
                const list = document.getElementById('pod-list');
                list.classList.remove('hidden');
                this.isOpen = true;
                this.searchText = '';
                this.highlightedIndex = -1;
                this.updateFilter();
                document.getElementById('pod-trigger').focus();
            },

            close() {
                const list = document.getElementById('pod-list');
                list.classList.add('hidden');
                this.isOpen = false;
                this.searchText = '';
                this.hideSearchPopup();
            },

            handleKeydown(e) {
                if (!this.isOpen && (e.key.length === 1 || e.key === 'ArrowDown')) {
                    this.open();
                }
                if (!this.isOpen) return;

                const items = this.getVisibleItems();

                switch (e.key) {
                    case 'Escape':
                        this.close();
                        e.preventDefault();
                        break;
                    case 'ArrowDown':
                        e.preventDefault();
                        this.highlightedIndex = Math.min(this.highlightedIndex + 1, items.length - 1);
                        this.updateHighlight();
                        break;
                    case 'ArrowUp':
                        e.preventDefault();
                        this.highlightedIndex = Math.max(this.highlightedIndex - 1, 0);
                        this.updateHighlight();
                        break;
                    case 'Enter':
                        e.preventDefault();
                        if (this.highlightedIndex >= 0 && items[this.highlightedIndex]) {
                            this.selectItem(items[this.highlightedIndex].dataset.value);
                        } else if (items.length === 1) {
                            this.selectItem(items[0].dataset.value);
                        }
                        break;
                    case 'Backspace':
                        e.preventDefault();
                        this.searchText = this.searchText.slice(0, -1);
                        this.updateFilter();
                        this.showSearchPopup();
                        break;
                    default:
                        if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
                            e.preventDefault();
                            this.searchText += e.key.toLowerCase();
                            this.updateFilter();
                            this.showSearchPopup();
                            const newItems = this.getVisibleItems();
                            if (newItems.length > 0) {
                                this.highlightedIndex = 0;
                                this.updateHighlight();
                            }
                        }
                }
            },

            getVisibleItems() {
                return Array.from(document.querySelectorAll('#pod-list .searchable-dropdown-item:not(.hidden)'));
            },

            updateFilter() {
                const items = document.querySelectorAll('#pod-list .searchable-dropdown-item');
                const search = this.searchText.toLowerCase();

                items.forEach(item => {
                    const text = item.dataset.text.toLowerCase();
                    if (!search || text.includes(search)) {
                        item.classList.remove('hidden');
                        if (search) {
                            const regex = new RegExp(`(${this.escapeRegex(search)})`, 'gi');
                            item.innerHTML = item.dataset.text.replace(regex, '<span class="match">$1</span>');
                        } else {
                            item.innerHTML = item.dataset.text;
                        }
                    } else {
                        item.classList.add('hidden');
                    }
                });

                if (this.highlightedIndex >= 0) {
                    const visibleItems = this.getVisibleItems();
                    if (this.highlightedIndex >= visibleItems.length) {
                        this.highlightedIndex = visibleItems.length - 1;
                    }
                }
            },

            updateHighlight() {
                const items = document.querySelectorAll('#pod-list .searchable-dropdown-item');
                items.forEach(item => item.classList.remove('bg-blue-500', 'text-white'));

                const visibleItems = this.getVisibleItems();
                if (this.highlightedIndex >= 0 && visibleItems[this.highlightedIndex]) {
                    visibleItems[this.highlightedIndex].classList.add('bg-blue-500', 'text-white');
                    visibleItems[this.highlightedIndex].scrollIntoView({ block: 'nearest' });
                }
            },

            selectItem(value) {
                const pod = podList.find(p => p.name === value);
                if (pod) {
                    const nodeInfo = pod.node ? ` @${pod.node}` : '';
                    document.getElementById('pod').value = value;
                    document.getElementById('pod-trigger').textContent = `${pod.name} (${pod.status}, ${pod.ready})${nodeInfo}`;
                    saveSettings();
                }
                this.close();
            },

            showSearchPopup() {
                const popup = document.getElementById('search-popup');
                const searchText = document.getElementById('search-text');

                if (this.searchText) {
                    searchText.textContent = this.searchText;
                    popup.classList.add('visible');
                    clearTimeout(this.hideTimeout);
                    this.hideTimeout = setTimeout(() => {
                        if (!this.searchText) this.hideSearchPopup();
                    }, 2000);
                } else {
                    this.hideSearchPopup();
                }
            },

            hideSearchPopup() {
                document.getElementById('search-popup').classList.remove('visible');
                clearTimeout(this.hideTimeout);
            },

            escapeRegex(str) {
                return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            },

            setItems(pods) {
                podList = pods;
                const list = document.getElementById('pod-list');
                list.innerHTML = pods.map(p => {
                    const nodeInfo = p.node ? ` @${p.node}` : '';
                    const text = `${p.name} (${p.status}, ${p.ready})${nodeInfo}`;
                    return `<div class="searchable-dropdown-item px-2 py-1 cursor-pointer text-sm border-b border-gray-200 dark:border-gray-600 hover:bg-blue-100 dark:hover:bg-gray-600" data-value="${p.name}" data-text="${text}">${text}</div>`;
                }).join('');

                list.querySelectorAll('.searchable-dropdown-item').forEach(item => {
                    item.addEventListener('click', () => this.selectItem(item.dataset.value));
                    item.addEventListener('mouseenter', () => {
                        const items = this.getVisibleItems();
                        this.highlightedIndex = items.indexOf(item);
                        this.updateHighlight();
                    });
                });
            },

            setValue(value) {
                const pod = podList.find(p => p.name === value);
                if (pod) {
                    const nodeInfo = pod.node ? ` @${pod.node}` : '';
                    document.getElementById('pod').value = value;
                    document.getElementById('pod-trigger').textContent = `${pod.name} (${pod.status}, ${pod.ready})${nodeInfo}`;
                } else {
                    document.getElementById('pod').value = '';
                    document.getElementById('pod-trigger').textContent = '-- Pod 선택 --';
                }
            }
        };

        // ===== 설정 저장/로드 =====

        // ===== 필터 프리셋 =====
        const PRESETS_KEY = 'k8s-log-viewer-presets';

        function getFilterState() {
            return {
                wordFind: document.getElementById('word-find')?.value || '',
                wordFindEnabled: document.getElementById('word-find-enabled')?.checked ?? true,
                wordRemove: document.getElementById('word-remove')?.value || '',
                wordRemoveEnabled: document.getElementById('word-remove-enabled')?.checked ?? true,

                classShowEnabled: document.getElementById('class-show-enabled')?.checked ?? true,

                classRemoveEnabled: document.getElementById('class-remove-enabled')?.checked ?? true,

                highlightEnabled: document.getElementById('highlight-enabled')?.checked ?? true,
                levels: {

                    debug: document.getElementById('level-debug')?.checked ?? true,

                    warn: document.getElementById('level-warn')?.checked ?? true,

        function setFilterState(state) {
            if (!state) return;

            if (state.wordFind !== undefined) document.getElementById('word-find').value = state.wordFind;
            if (state.wordFindEnabled !== undefined) document.getElementById('word-find-enabled').checked = state.wordFindEnabled;
            if (state.wordRemove !== undefined) document.getElementById('word-remove').value = state.wordRemove;
            if (state.wordRemoveEnabled !== undefined) document.getElementById('word-remove-enabled').checked = state.wordRemoveEnabled;
            if (state.classShow !== undefined) document.getElementById('class-show').value = state.classShow;
            if (state.classShowEnabled !== undefined) document.getElementById('class-show-enabled').checked = state.classShowEnabled;
            if (state.classRemove !== undefined) document.getElementById('class-remove').value = state.classRemove;
            if (state.classRemoveEnabled !== undefined) document.getElementById('class-remove-enabled').checked = state.classRemoveEnabled;
            if (state.highlightKeyword !== undefined) document.getElementById('highlight-keyword').value = state.highlightKeyword;
            if (state.highlightEnabled !== undefined) document.getElementById('highlight-enabled').checked = state.highlightEnabled;

            if (state.levels) {
                if (state.levels.verbose !== undefined) document.getElementById('level-verbose').checked = state.levels.verbose;
                if (state.levels.debug !== undefined) document.getElementById('level-debug').checked = state.levels.debug;
                if (state.levels.info !== undefined) document.getElementById('level-info').checked = state.levels.info;
                if (state.levels.warn !== undefined) document.getElementById('level-warn').checked = state.levels.warn;
                if (state.levels.error !== undefined) document.getElementById('level-error').checked = state.levels.error;

        function savePreset() {

            presets[name.trim()] = getFilterState();
