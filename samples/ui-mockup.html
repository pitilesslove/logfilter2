        // ===== K8s API 함수 =====
        async function loadContexts() {
            setStatus('Context 로딩 중...');
            try {
                const res = await fetch('/api/k8s/contexts');
                const data = await res.json();
                const select = document.getElementById('context');
                const saved = loadSettings();

                select.innerHTML = data.contexts.map(c =>
                    `<option value="${c}"${c === (saved.context || data.current) ? ' selected' : ''}>${c}</option>`
                ).join('');
                setStatus(`Context ${data.contexts.length}개 로드됨`);
                if (data.contexts.length > 0) loadNamespaces();
            } catch (e) {
                setStatus('Context 로드 실패: ' + e.message);
            }
        }

        async function loadNamespaces() {
            const context = document.getElementById('context').value;
            setStatus('Namespace 로딩 중...');
            try {
                const res = await fetch(`/api/k8s/namespaces?context=${encodeURIComponent(context)}`);
                const data = await res.json();
                const select = document.getElementById('namespace');
                const saved = loadSettings();

                let defaultNs = saved.namespace || data.namespaces.find(n => n.includes('ums')) || 'default';
                if (!data.namespaces.includes(defaultNs)) {
                    defaultNs = data.namespaces[0] || 'default';
                }

                select.innerHTML = data.namespaces.map(n =>
                    `<option value="${n}"${n === defaultNs ? ' selected' : ''}>${n}</option>`
                ).join('');
                setStatus(`Namespace ${data.namespaces.length}개 로드됨`);
                saveSettings();
                if (data.namespaces.length > 0) loadPods();
            } catch (e) {
                setStatus('Namespace 로드 실패: ' + e.message);
            }
        }

        async function loadPods() {
            const context = document.getElementById('context').value;
            const namespace = document.getElementById('namespace').value;
            setStatus('Pod 로딩 중...');
            try {
                const res = await fetch(`/api/k8s/pods?context=${encodeURIComponent(context)}&namespace=${encodeURIComponent(namespace)}`);
                const data = await res.json();
                const saved = loadSettings();

                podSearch.setItems(data.pods);

                let defaultPod = saved.pod;
                if (!defaultPod || !data.pods.find(p => p.name === defaultPod)) {
                    defaultPod = data.pods[0]?.name || '';
                }

                podSearch.setValue(defaultPod);
                setStatus(`Pod ${data.pods.length}개 로드됨 (키보드로 검색 가능)`);
                saveSettings();
            } catch (e) {
                setStatus('Pod 로드 실패: ' + e.message);
            }
        }

        async function connectPod() {
            const context = document.getElementById('context').value;
            const namespace = document.getElementById('namespace').value;
            const pod = document.getElementById('pod').value;

            if (!pod) {
                setStatus('Pod를 선택하세요');
                return;
            }

            if (isStreaming) {
                stopStream();
            }

            saveSettings();
            setStatus(`Pod 로그 가져오는 중: ${pod}`);

            try {
                const url = `/api/k8s/logs?pod=${encodeURIComponent(pod)}&namespace=${encodeURIComponent(namespace)}&context=${encodeURIComponent(context)}&tail=${DEFAULT_TAIL_COUNT}`;
                const res = await fetch(url);
                const data = await res.json();
                if (data.error) {
                    setStatus('오류: ' + data.error);
                    return;
                }
                await refreshLogs(true);  // 맨 아래로 스크롤
                setStatus(`Pod 로그 로드됨: ${pod} (${data.count}줄) - 실시간 스트리밍 시작...`);
            } catch (e) {
                setStatus('로그 가져오기 실패: ' + e.message);
                return;
            }

            startStream(pod, namespace, context);
        }

        // ===== SSE 스트리밍 함수 =====
        function startStream(pod, namespace, context) {
            if (eventSource) {
                eventSource.close();
            }

            const url = `/api/k8s/logs/stream?pod=${encodeURIComponent(pod)}&namespace=${encodeURIComponent(namespace)}&context=${encodeURIComponent(context)}&tail=0`;
            eventSource = new EventSource(url);
            isStreaming = true;
            updateStreamingUI(true);

            eventSource.addEventListener('init', (e) => {
                const data = JSON.parse(e.data);
                streamId = data.streamId;
                setStatus(`🔴 실시간 스트리밍 중: ${data.pod} (Stream #${streamId})`);
            });

            eventSource.addEventListener('log', (e) => {
                const log = JSON.parse(e.data);
                addLogEntry(log);
            });

            eventSource.addEventListener('end', (e) => {
                const data = JSON.parse(e.data);
                setStatus(`스트리밍 종료: ${data.lines}줄 수신됨`);
                stopStream();
            });

            eventSource.addEventListener('error', (e) => {
                if (eventSource.readyState === EventSource.CLOSED) {
                    setStatus('스트리밍 연결 종료됨');
                    stopStream();
                }
            });

            eventSource.onerror = () => {
                if (isStreaming) {
                    setStatus('스트리밍 연결 끊김 - 재연결 중...');
                }
            };
        }

        function stopStream() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
            if (streamId) {
                fetch(`/api/k8s/logs/stream/stop?streamId=${streamId}`).catch(() => {});
                streamId = null;
            }
            isStreaming = false;
            updateStreamingUI(false);
        }

        // ===== 필터 상태 캐시 =====
        let cachedFilterState = null;

        function getCachedFilterState() {
            if (!cachedFilterState) {
                cachedFilterState = {
                    wordFind: document.getElementById('word-find-enabled')?.checked ?
                        (document.getElementById('word-find')?.value || '').toLowerCase().split('|').map(k => k.trim()).filter(k => k) : [],
                    wordRemove: document.getElementById('word-remove-enabled')?.checked ?
                        (document.getElementById('word-remove')?.value || '').toLowerCase().split('|').map(k => k.trim()).filter(k => k) : [],
                    classShow: document.getElementById('class-show-enabled')?.checked ?
                        (document.getElementById('class-show')?.value || '').toLowerCase().split('|').map(c => c.trim()).filter(c => c) : [],
                    classRemove: document.getElementById('class-remove-enabled')?.checked ?
                        (document.getElementById('class-remove')?.value || '').toLowerCase().split('|').map(c => c.trim()).filter(c => c) : [],
                    highlightKeyword: document.getElementById('highlight-enabled')?.checked ?
                        (document.getElementById('highlight-keyword')?.value || '').toLowerCase().split('|').map(k => k.trim()).filter(k => k) : [],
                    enabledLevels: getEnabledLevels()
                };
            }
            return cachedFilterState;
        }

        function invalidateFilterCache() {
            cachedFilterState = null;
        }

        function getEnabledLevels() {
            const levels = [];
            if (document.getElementById('level-verbose')?.checked) levels.push('TRACE');
            if (document.getElementById('level-debug')?.checked) levels.push('DEBUG');
            if (document.getElementById('level-info')?.checked) levels.push('INFO');
            if (document.getElementById('level-warn')?.checked) levels.push('WARN');
            if (document.getElementById('level-error')?.checked) levels.push('ERROR');
            if (document.getElementById('level-fatal')?.checked) levels.push('FATAL');
            return levels;
        }

        // 단일 로그가 필터를 통과하는지 확인
        function passesFilter(log, state) {
            // 레벨 필터: 체크된 레벨이 없으면 모두 표시, 있으면 해당 레벨만
            if (state.enabledLevels.length > 0 && !state.enabledLevels.includes(log.level)) {
                return false;
            }

            // Word Find 필터
            if (state.wordFind.length > 0) {
                const logText = ((log.message || '') + ' ' + (log.class || '')).toLowerCase();
                if (!state.wordFind.some(k => logText.includes(k))) return false;
            }

            // Word Remove 필터
            if (state.wordRemove.length > 0) {
                const logText = (log.message || '').toLowerCase();
                if (state.wordRemove.some(k => logText.includes(k))) return false;
            }

            // Class Show 필터
            if (state.classShow.length > 0) {
                const className = (log.class || '').toLowerCase();
                if (!state.classShow.some(c => className.includes(c))) return false;
            }

            // Class Remove 필터
            if (state.classRemove.length > 0) {
                const className = (log.class || '').toLowerCase();
                if (state.classRemove.some(c => className.includes(c))) return false;
            }

            return true;
        }

        // 하이라이트 여부 확인
        function checkHighlight(log, state) {
            if (state.highlightKeyword.length === 0) return false;
            const logText = ((log.message || '') + ' ' + (log.class || '')).toLowerCase();
            return state.highlightKeyword.some(k => logText.includes(k));
        }

        // 증분 로그 추가 (DOM 풀 재사용)
        function appendFilteredLog(log, index) {
            const container = document.querySelector('.log-table-container');
            const highlightKeyword = document.getElementById('highlight-enabled')?.checked ?
                document.getElementById('highlight-keyword')?.value || '' : '';

            // 풀이 초기화되지 않았으면 아무것도 하지 않음 (applyFilter에서 처리됨)
            if (!rowPool.initialized) return;

            if (!virtualScroll.enabled) {
                // 가상 스크롤 비활성화 - 풀 내에서 다음 빈 슬롯 사용
                const displayCount = Math.min(index + 1, rowPool.poolSize);
                if (index < rowPool.poolSize) {
                    rowPool.updateRow(rowPool.rows[index], log, index, highlightKeyword);
                }
            } else if (autoScroll) {
                // 가상 스크롤 + 자동 스크롤 - 맨 아래로 스크롤하며 풀 업데이트
                const clientHeight = container.clientHeight;
                const currentVisibleRows = Math.ceil(clientHeight / virtualScroll.rowHeight) || 30;
                const maxVisible = currentVisibleRows + virtualScroll.bufferSize * 2;

                // 새 로그가 보이는 영역에 포함되도록 visibleEnd 업데이트
                const totalLogs = filteredLogs.length;
                const newStart = Math.max(0, totalLogs - maxVisible);
                const newEnd = totalLogs;

                virtualScroll.visibleStart = newStart;
                virtualScroll.visibleEnd = newEnd;

                // 패딩 업데이트
                const topPadding = newStart * virtualScroll.rowHeight;
                rowPool.updatePadding(topPadding, 0);

                // 풀의 각 행 업데이트
                const visibleCount = newEnd - newStart;
                for (let i = 0; i < rowPool.poolSize; i++) {
                    if (i < visibleCount) {
                        const logIndex = newStart + i;
                        rowPool.updateRow(rowPool.rows[i], filteredLogs[logIndex], logIndex, highlightKeyword);
                    } else {
                        rowPool.hideRow(rowPool.rows[i]);
                    }
                }
            }
            // autoScroll OFF면 데이터만 추가되고 렌더링은 스크롤 이벤트에서 처리

            // 인디케이터 업데이트 (간소화)
            updateIndicatorForNewLog(log, index);
        }

        // 단일 행에 대한 이벤트 바인딩
        function attachRowEventsForRow(row) {
            if (!row || !row.hasAttribute('data-index')) return;

            row.addEventListener('click', function(e) {
                if (e.target.classList.contains('json-preview')) {
                    toggleJsonExpand(e.target);
                    return;
                }
                document.querySelectorAll('.log-table tr.log-row-selected').forEach(r => r.classList.remove('log-row-selected'));
                this.classList.add('log-row-selected');
            });

            row.addEventListener('dblclick', function() {
                const index = parseInt(this.dataset.index);
                if (!isNaN(index) && filteredLogs[index]) {
                    filteredLogs[index].isBookmarked = !filteredLogs[index].isBookmarked;
                    applyFilter();
                }
            });
        }

        // 새 로그에 대한 인디케이터만 업데이트
        function updateIndicatorForNewLog(log, index) {
            const leftContainer = document.querySelector('.indicator-left');
            const rightContainer = document.querySelector('.indicator-right');
            if (!leftContainer || !rightContainer || filteredLogs.length === 0) return;

            const containerHeight = leftContainer.clientHeight;
            const top = Math.floor((index / filteredLogs.length) * containerHeight);

            if (log.isBookmarked) {
                leftContainer.innerHTML += `<div class="absolute w-full h-0.5 bg-yellow-400" style="top: ${top}px"></div>`;
            }
            if (log.level === 'ERROR' || log.level === 'FATAL') {
                rightContainer.innerHTML += `<div class="absolute w-full h-0.5 bg-red-500" style="top: ${top}px"></div>`;
            } else if (log.level === 'WARN') {
                rightContainer.innerHTML += `<div class="absolute w-full h-0.5 bg-orange-400" style="top: ${top}px"></div>`;
            }
        }

        function addLogEntry(log) {
            const entry = {
                line: allLogs.length + 1,
                dateTime: log.dateTime,
                level: log.level,
                thread: log.thread,
                class: log.class,
                message: log.message,
                hasStackTrace: log.hasStackTrace,
                isBookmarked: false,
                isHighlighted: false
            };

            allLogs.push(entry);

            // 캐시된 필터 상태로 통과 여부 확인
            const filterState = getCachedFilterState();
            if (passesFilter(entry, filterState)) {
                entry.isHighlighted = checkHighlight(entry, filterState);
                const newIndex = filteredLogs.length;
                filteredLogs.push(entry);

                if (entry.isHighlighted) {
                    highlightedIndices.push(newIndex);
                    updateHighlightCount();
                }

                // DOM에 증분 추가
                appendFilteredLog(entry, newIndex);
            }

            // 자동 스크롤
            if (autoScroll) {
                requestAnimationFrame(() => {
                    const container = document.querySelector('.log-table-container');
                    if (container) container.scrollTop = container.scrollHeight;
                });
            }

            updateLogCount();
        }

        function updateStreamingUI(streaming) {
            const connectBtn = document.getElementById('connect-btn');
            if (connectBtn) {
                if (streaming) {
                    connectBtn.textContent = '⏹ 중지';
                    connectBtn.onclick = stopStream;
                    connectBtn.className = 'px-3 py-1 bg-red-500 hover:bg-red-600 text-white rounded text-sm transition-colors';
                } else {
                    connectBtn.textContent = '▶ 시작';
                    connectBtn.onclick = connectPod;
                    connectBtn.className = 'px-3 py-1 bg-green-600 hover:bg-green-700 text-white rounded text-sm transition-colors';
                }
            }
        }

        function toggleAutoScroll() {
            autoScroll = !autoScroll;
            updateAutoScrollStatus();
            // 자동 스크롤 활성화 시 맨 아래로 이동
            if (autoScroll) {
                const container = document.querySelector('.log-table-container');
                if (container) {
                    container.scrollTop = container.scrollHeight;
                }
            }
        }

        function updateAutoScrollStatus() {
            document.getElementById('auto-scroll-status').textContent = `자동스크롤: ${autoScroll ? 'ON' : 'OFF'}`;
        }

        // ===== 테마 관리 =====
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.classList.contains('dark');

            if (isDark) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }

            const btn = document.getElementById('theme-toggle');
            btn.textContent = html.classList.contains('dark') ? '☀️ 라이트' : '🌙 다크';
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }

            const btn = document.getElementById('theme-toggle');
            if (btn) {
                btn.textContent = savedTheme === 'dark' ? '☀️ 라이트' : '🌙 다크';
            }
        }

        // ===== 로그 관리 함수 =====
        async function loadSampleLogs() {
            setStatus('샘플 로딩 중...');
            const res = await fetch('/api/load');
            const data = await res.json();
            setStatus(`샘플 로그 로드됨: ${data.count}줄`);
            refreshLogs(true);  // 맨 아래로 스크롤
        }

        async function clearLogs() {
            await fetch('/api/clear');
            allLogs = [];
            filteredLogs = [];
            selectedLogIndex = -1;  // 선택 상태 초기화

            // DOM 풀 리셋
            if (rowPool.initialized) {
                rowPool.reset();
            }

            renderLogs([]);
            updateIndicator([]);
            setStatus('로그 클리어됨');
        }

        async function refreshLogs(scrollToBottom = false) {
            const res = await fetch('/api/logs');
            allLogs = await res.json();
            applyFilter();

            // 맨 아래로 스크롤 (렌더링 완료 후)
            if (scrollToBottom) {
                requestAnimationFrame(() => {
                    setTimeout(() => {
                        const container = document.querySelector('.log-table-container');
                        if (container) {
                            container.scrollTop = container.scrollHeight;
                        }
                    }, 50);
                });
            }
        }

        // ===== 로그 다운로드 =====
        function downloadLogs() {
            const logsToDownload = filteredLogs.length > 0 ? filteredLogs : allLogs;

            if (logsToDownload.length === 0) {
                setStatus('다운로드할 로그가 없습니다');
                return;
            }

            const logText = logsToDownload.map(log => {
                const parts = [
                    log.dateTime || '',
                    log.level || '',
                    log.thread ? `[${log.thread}]` : '',
                    log.class || '',
                    log.message || ''
                ].filter(p => p).join(' ');
                return parts;
            }).join('\n');

            const now = new Date();
            const timestamp = now.toISOString().replace(/[:.]/g, '-').slice(0, 19);
            const pod = document.getElementById('pod')?.value || 'logs';
            const filename = `${pod}-${timestamp}.log`;

            const blob = new Blob([logText], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            setStatus(`${logsToDownload.length}줄 다운로드됨: ${filename}`);
        }

        // ===== 필터 함수 =====
        function applyFilter() {
            // 필터 캐시 무효화 및 새로 생성
            invalidateFilterCache();
            const filterState = getCachedFilterState();

            // 필터링 수행 (캐시된 상태 사용)
            filteredLogs = allLogs.filter(log => passesFilter(log, filterState));

            // 하이라이트 처리
            highlightedIndices = [];
            filteredLogs.forEach((log, index) => {
                log.isHighlighted = checkHighlight(log, filterState);
                if (log.isHighlighted) {
                    highlightedIndices.push(index);
                }
            });

            updateHighlightCount();
            renderLogs(filteredLogs);
            updateIndicator(filteredLogs);
            updateLogCount();
        }

        // ===== 하이라이트 네비게이션 =====
        function updateHighlightCount() {
            const countEl = document.getElementById('highlight-count');
            if (!countEl) return;

            if (highlightedIndices.length === 0) {
                currentHighlightPos = -1;
                countEl.textContent = '0/0';
            } else {
                if (currentHighlightPos < 0) currentHighlightPos = 0;
                if (currentHighlightPos >= highlightedIndices.length) currentHighlightPos = highlightedIndices.length - 1;
                countEl.textContent = `${currentHighlightPos + 1}/${highlightedIndices.length}`;
            }
        }

        function navigateHighlight(direction) {
            if (highlightedIndices.length === 0) {
                setStatus('하이라이트된 항목이 없습니다');
                return;
            }

            currentHighlightPos += direction;

            if (currentHighlightPos < 0) {
                currentHighlightPos = highlightedIndices.length - 1;
            } else if (currentHighlightPos >= highlightedIndices.length) {
                currentHighlightPos = 0;
            }

            updateHighlightCount();

            const targetIndex = highlightedIndices[currentHighlightPos];
            scrollToRow(targetIndex);
            selectRow(targetIndex);
        }

        function scrollToRow(index) {
            const container = document.querySelector('.log-table-container');
            if (!container) return;

            if (virtualScroll.enabled) {
                const scrollTop = index * virtualScroll.rowHeight - container.clientHeight / 2;
                container.scrollTop = Math.max(0, scrollTop);
            } else {
                const row = container.querySelector(`tr[data-index="${index}"]`);
                if (row) {
                    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }

        function selectRow(index) {
            // index 기반으로 선택 상태 저장
            selectedLogIndex = index;

            // 모든 행의 선택 상태 업데이트
            document.querySelectorAll('.log-table tr[data-index]').forEach(r => {
                const rIndex = parseInt(r.dataset.index);
                if (rIndex === selectedLogIndex) {
                    r.classList.add('log-row-selected');
                } else {
                    r.classList.remove('log-row-selected');
                }
            });
        }

        // ===== 렌더링 함수 =====
        function renderLogs(logs) {
            const container = document.querySelector('.log-table-container');
            const tbody = document.querySelector('.log-table tbody');

            // 기존 spacer 제거 (있으면)
            const oldSpacer = container.querySelector('.virtual-scroll-spacer');
            if (oldSpacer) oldSpacer.remove();

            virtualScroll.enabled = logs.length >= virtualScroll.threshold;

            // DOM 풀 초기화 (최초 1회)
            if (!rowPool.initialized) {
                rowPool.init(tbody);
                setupEventDelegation(tbody);
            }

            if (!virtualScroll.enabled) {
                renderAllRowsWithPool(logs, tbody);
                return;
            }

            const containerHeight = container.clientHeight;
            const visibleRows = Math.ceil(containerHeight / virtualScroll.rowHeight) || 30;

            virtualScroll.visibleStart = 0;
            virtualScroll.visibleEnd = Math.min(visibleRows + virtualScroll.bufferSize * 2, logs.length);
            renderVisibleRowsWithPool(logs, 0, virtualScroll.visibleEnd);

            // 스크롤 핸들러 - requestAnimationFrame 기반
            // 항상 최신 스크롤 위치에서 렌더링하여 뷰포트 누락 방지
            let pendingRender = false;

            container.onscroll = () => {
                // 자동 스크롤 상태 업데이트 (항상 즉시 처리)
                const scrollTop = container.scrollTop;
                const scrollHeight = container.scrollHeight;
                const clientHeight = container.clientHeight;
                const isNearBottom = scrollHeight - scrollTop - clientHeight < 50;

                autoScroll = isNearBottom;
                updateAutoScrollStatus();

                if (!virtualScroll.enabled) return;

                // 다음 프레임에 렌더링 예약 (중복 방지)
                if (!pendingRender) {
                    pendingRender = true;
                    requestAnimationFrame(() => {
                        pendingRender = false;

                        // 현재(최신) 스크롤 위치 사용
                        const currentScrollTop = container.scrollTop;
                        const currentClientHeight = container.clientHeight;

                        const currentVisibleRows = Math.ceil(currentClientHeight / virtualScroll.rowHeight) || 30;
                        const startIndex = Math.max(0, Math.floor(currentScrollTop / virtualScroll.rowHeight) - virtualScroll.bufferSize);
                        const endIndex = Math.min(logs.length, startIndex + currentVisibleRows + virtualScroll.bufferSize * 2);

                        if (startIndex !== virtualScroll.visibleStart || endIndex !== virtualScroll.visibleEnd) {
                            virtualScroll.visibleStart = startIndex;
                            virtualScroll.visibleEnd = endIndex;
                            renderVisibleRowsWithPool(logs, startIndex, endIndex);
                        }
                    });
                }
            };
        }

        // Event Delegation 설정 (tbody에 단일 리스너)
        function setupEventDelegation(tbody) {
            tbody.addEventListener('click', function(e) {
                const row = e.target.closest('tr[data-index]');
                if (!row) return;

                // JSON 클릭 처리
                if (e.target.classList.contains('json-preview')) {
                    toggleJsonExpand(e.target);
                    return;
                }

                // 행 선택 (index 기반으로 저장)
                const index = parseInt(row.dataset.index);
                if (!isNaN(index)) {
                    selectedLogIndex = index;

                    // 행 선택 시 자동 스크롤 OFF (화면 고정, 로그는 계속 쌓임)
                    autoScroll = false;
                    updateAutoScrollStatus();

                    // 모든 행의 선택 상태 업데이트
                    document.querySelectorAll('.log-table tr[data-index]').forEach(r => {
                        const rIndex = parseInt(r.dataset.index);
                        if (rIndex === selectedLogIndex) {
                            r.classList.add('log-row-selected');
                        } else {
                            r.classList.remove('log-row-selected');
                        }
                    });
                }
            });

            tbody.addEventListener('dblclick', function(e) {
                const row = e.target.closest('tr[data-index]');
                if (!row) return;

                const index = parseInt(row.dataset.index);
                if (!isNaN(index) && filteredLogs[index]) {
                    const log = filteredLogs[index];
                    log.isBookmarked = !log.isBookmarked;

                    // 해당 행만 업데이트 (전체 재렌더링 없이)
                    updateSingleRow(row, log, index);
                    updateIndicator(filteredLogs);
                }
            });
        }

        // 단일 행 업데이트 (북마크 토글 등)
        function updateSingleRow(row, log, index) {
            const highlightKeyword = document.getElementById('highlight-enabled')?.checked ?
                document.getElementById('highlight-keyword')?.value || '' : '';

            // 행 클래스 업데이트
            row.className = 'border-b border-gray-200 dark:border-gray-700';
            if (index === selectedLogIndex) {
                row.classList.add('log-row-selected');
            } else if (log.isBookmarked) {
                row.classList.add('log-row-bookmark');
            } else if (log.isHighlighted) {
                row.classList.add('log-row-highlight');
            } else if (log.level === 'ERROR' || log.level === 'FATAL') {
                row.classList.add('log-row-error');
            } else if (log.level === 'WARN') {
                row.classList.add('log-row-warn');
            } else {
                row.classList.add('hover:bg-gray-100', 'dark:hover:bg-gray-800');
            }

            // 북마크 셀 업데이트
            const bookmarkCell = row.querySelector('.cell-bookmark');
            if (bookmarkCell) {
                bookmarkCell.textContent = log.isBookmarked ? '★' : '';
            }
        }

        // DOM 풀을 사용한 모든 행 렌더링 (가상 스크롤 비활성화 시)
        function renderAllRowsWithPool(logs, tbody) {
            const highlightKeyword = document.getElementById('highlight-enabled')?.checked ?
                document.getElementById('highlight-keyword')?.value || '' : '';

            rowPool.updatePadding(0, 0);

            const displayCount = Math.min(logs.length, rowPool.poolSize);

            for (let i = 0; i < rowPool.poolSize; i++) {
                if (i < displayCount) {
                    rowPool.updateRow(rowPool.rows[i], logs[i], i, highlightKeyword);
                } else {
                    rowPool.hideRow(rowPool.rows[i]);
                }
            }
        }

        // DOM 풀을 사용한 가시 영역 렌더링 (가상 스크롤)
        function renderVisibleRowsWithPool(logs, startIndex, endIndex) {
            const highlightKeyword = document.getElementById('highlight-enabled')?.checked ?
                document.getElementById('highlight-keyword')?.value || '' : '';

            const topPadding = startIndex * virtualScroll.rowHeight;
            const bottomPadding = Math.max(0, (logs.length - endIndex) * virtualScroll.rowHeight);

            rowPool.updatePadding(topPadding, bottomPadding);

            const visibleCount = endIndex - startIndex;

            for (let i = 0; i < rowPool.poolSize; i++) {
                if (i < visibleCount) {
                    const logIndex = startIndex + i;
                    rowPool.updateRow(rowPool.rows[i], logs[logIndex], logIndex, highlightKeyword);
                } else {
                    rowPool.hideRow(rowPool.rows[i]);
                }
            }
        }

        // 레거시 함수 (하위 호환성)
        function renderAllRows(logs, tbody) {
            const highlightKeyword = document.getElementById('highlight-enabled')?.checked ?
                document.getElementById('highlight-keyword')?.value || '' : '';

            tbody.innerHTML = logs.map((log, index) => renderRow(log, index, highlightKeyword)).join('');
            attachRowEvents();
        }

        function renderVisibleRows(logs, tbody, startIndex, endIndex) {
            const highlightKeyword = document.getElementById('highlight-enabled')?.checked ?
                document.getElementById('highlight-keyword')?.value || '' : '';

            const topPadding = startIndex * virtualScroll.rowHeight;
            const bottomPadding = (logs.length - endIndex) * virtualScroll.rowHeight;

            let html = '';
            if (topPadding > 0) {
                html += `<tr style="height: ${topPadding}px;"><td colspan="6"></td></tr>`;
            }

            for (let i = startIndex; i < endIndex; i++) {
                html += renderRow(logs[i], i, highlightKeyword);
            }

            if (bottomPadding > 0) {
                html += `<tr style="height: ${bottomPadding}px;"><td colspan="6"></td></tr>`;
            }

            tbody.innerHTML = html;
            attachRowEvents();
        }

        function renderRow(log, index, highlightKeyword) {
            let rowClass = 'hover:bg-gray-100 dark:hover:bg-gray-800';
            if (log.isBookmarked) rowClass = 'log-row-bookmark';
            else if (log.isHighlighted) rowClass = 'log-row-highlight';
            else if (log.level === 'ERROR' || log.level === 'FATAL') rowClass = 'log-row-error';
            else if (log.level === 'WARN') rowClass = 'log-row-warn';

            let message = formatMessage(log.message, highlightKeyword);

            return `<tr class="${rowClass} border-b border-gray-200 dark:border-gray-700" data-index="${index}" style="height: ${virtualScroll.rowHeight}px;">
                <td class="w-8 text-center text-yellow-500">${log.isBookmarked ? '★' : ''}</td>
                <td class="w-44 px-1">${log.dateTime}</td>
                <td class="w-14 text-center font-bold level-${log.level}">${log.level}</td>
                <td class="w-36 px-1 text-purple-600 dark:text-purple-400 truncate">${escapeHtml(log.thread)}</td>
                <td class="w-48 px-1 text-green-700 dark:text-green-400 truncate">${escapeHtml(log.class)}</td>
                <td class="min-w-[400px] px-1">${message}</td>
            </tr>`;
        }

        // 메시지 포맷팅 (JSON 감지 및 하이라이트)
        function formatMessage(rawMessage, highlightKeyword) {
            // JSON 패턴 감지: {...} 또는 [...]
            const jsonRegex = /(\{[\s\S]*\}|\[[\s\S]*\])/g;
            let message = escapeHtml(rawMessage);

            // JSON 데이터가 포함되어 있는지 확인
            const jsonMatches = rawMessage.match(jsonRegex);
            if (jsonMatches) {
                jsonMatches.forEach(jsonStr => {
                    try {
                        JSON.parse(jsonStr); // 유효한 JSON인지 확인
                        const escapedJson = escapeHtml(jsonStr);
                        const preview = jsonStr.length > 80 ? escapeHtml(jsonStr.substring(0, 80)) + '...' : escapedJson;
                        const replacement = `<span class="json-preview text-blue-600 dark:text-blue-400" data-json="${escapedJson.replace(/"/g, '&quot;')}" title="클릭하여 JSON 확장">${preview}</span>`;
                        message = message.replace(escapedJson, replacement);
                    } catch (e) {
                        // JSON 파싱 실패 - 원본 유지
                    }
                });
            }

            // Word Filter (Find) 매칭 텍스트 컬러링 (녹색)
            const wordFindInput = document.getElementById('word-find');
            const wordFindValue = wordFindInput ? wordFindInput.value.trim() : '';
            if (wordFindValue) {
                const findKeywords = wordFindValue.split('|').map(k => k.trim()).filter(k => k);
                findKeywords.forEach(keyword => {
                    const regex = new RegExp(`(${escapeRegex(keyword)})`, 'gi');
                    message = message.replace(regex, '<span class="word-filter-match">$1</span>');
                });
            }

            // 하이라이트 키워드 적용 (노란색 배경)
            if (highlightKeyword) {
                const keywords = highlightKeyword.split('|').map(k => k.trim()).filter(k => k);
                keywords.forEach(keyword => {
                    const regex = new RegExp(`(${escapeRegex(keyword)})`, 'gi');
                    message = message.replace(regex, '<span class="keyword-match">$1</span>');
                });
            }

            return message;
        }

        function updateIndicator(logs) {
            const leftContainer = document.querySelector('.indicator-left');
            const rightContainer = document.querySelector('.indicator-right');

            if (!leftContainer || !rightContainer) return;

            leftContainer.innerHTML = '';
            rightContainer.innerHTML = '';

            if (logs.length === 0) return;

            const containerHeight = leftContainer.clientHeight || 300;

            logs.forEach((log, index) => {
                const top = (index / logs.length) * containerHeight;

                if (log.isHighlighted) {
                    leftContainer.innerHTML += `<div class="indicator-marker absolute w-full h-1 bg-yellow-400 cursor-pointer hover:h-2 transition-all" style="top: ${top}px" data-index="${index}" title="하이라이트 #${index + 1}"></div>`;
                } else if (log.isBookmarked) {
                    leftContainer.innerHTML += `<div class="indicator-marker absolute w-full h-1 bg-blue-400 cursor-pointer hover:h-2 transition-all" style="top: ${top}px" data-index="${index}" title="북마크 #${index + 1}"></div>`;
                }

                if (log.level === 'ERROR' || log.level === 'FATAL') {
                    rightContainer.innerHTML += `<div class="indicator-marker absolute w-full h-1 bg-red-500 cursor-pointer hover:h-2 transition-all" style="top: ${top}px" data-index="${index}" title="에러 #${index + 1}"></div>`;
                } else if (log.level === 'WARN') {
                    rightContainer.innerHTML += `<div class="indicator-marker absolute w-full h-1 bg-orange-400 cursor-pointer hover:h-2 transition-all" style="top: ${top}px" data-index="${index}" title="경고 #${index + 1}"></div>`;
                }
            });

            // 인디케이터 클릭 이벤트 (이벤트 위임)
            [leftContainer, rightContainer].forEach(container => {
                container.onclick = function(e) {
                    const marker = e.target.closest('.indicator-marker');
                    if (!marker) return;

                    const index = parseInt(marker.dataset.index);
                    if (!isNaN(index)) {
                        scrollToRow(index);
                        selectRow(index);
                    }
                };
            });
        }

        function updateLogCount() {
            document.getElementById('log-count-value').textContent = allLogs.length;
            document.getElementById('display-count').textContent = `표시: ${filteredLogs.length}줄`;
        }

        function setStatus(message) {
            document.getElementById('status-text').textContent = message;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function escapeRegex(str) {
            return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function attachRowEvents() {
            document.querySelectorAll('.log-table tbody tr[data-index]').forEach(row => {
                row.addEventListener('click', function(e) {
                    // JSON 클릭 처리
                    if (e.target.classList.contains('json-preview')) {
                        toggleJsonExpand(e.target);
                        return;
                    }

                    document.querySelectorAll('.log-table tr.log-row-selected').forEach(r => r.classList.remove('log-row-selected'));
                    this.classList.add('log-row-selected');
                });

                row.addEventListener('dblclick', function() {
                    const index = parseInt(this.dataset.index);
                    if (!isNaN(index) && filteredLogs[index]) {
                        filteredLogs[index].isBookmarked = !filteredLogs[index].isBookmarked;
                        applyFilter();
                    }
                });
            });
        }

        // JSON 토글 함수
        function toggleJsonExpand(element) {
            const isExpanded = element.classList.contains('json-expanded');
            const originalJson = element.dataset.json;

            if (isExpanded) {
                element.classList.remove('json-expanded');
                element.classList.add('json-preview');
                element.textContent = originalJson.length > 100 ? originalJson.substring(0, 100) + '...' : originalJson;
            } else {
                try {
                    const parsed = JSON.parse(originalJson);
                    const formatted = JSON.stringify(parsed, null, 2);
                    element.classList.remove('json-preview');
                    element.classList.add('json-expanded');
                    element.textContent = formatted;
                } catch (e) {
                    element.textContent = originalJson;
                }
            }
        }

        // ===== 초기화 =====
        function setupEventListeners() {
            podSearch.init();

            document.getElementById('context')?.addEventListener('change', () => {
                saveSettings();
                loadNamespaces();
            });
            document.getElementById('namespace')?.addEventListener('change', () => {
                saveSettings();
                loadPods();
            });

            document.querySelectorAll('fieldset input').forEach(input => {
                input.addEventListener('change', () => {
                    invalidateFilterCache();  // 즉시 캐시 무효화
                    applyFilter();
                    updateFilterInputStyles();
                });
                // 입력 시 즉시 캐시 무효화, 전체 필터는 debounce
                input.addEventListener('input', () => {
                    invalidateFilterCache();  // 즉시 캐시 무효화 (스트리밍 중 새 로그용)
                    updateFilterInputStyles();
                });
                input.addEventListener('input', debounce(() => {
                    applyFilter();  // 전체 필터링은 debounce
                }, 300));
            });

            // 초기 필터 입력 스타일 설정
            updateFilterInputStyles();

            document.getElementById('font-apply')?.addEventListener('click', () => {
                const fontSize = document.getElementById('font-size')?.value || 12;
                document.querySelector('.log-table').style.fontSize = fontSize + 'px';
            });

            document.getElementById('goto-line')?.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const line = parseInt(e.target.value);
                    if (line) {
                        const row = document.querySelector(`.log-table tbody tr[data-index="${line - 1}"]`);
                        if (row) {
                            row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            selectRow(line - 1);
                        }
                    }
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'F3' && !e.shiftKey) {
                    e.preventDefault();
                    navigateHighlight(1);
                } else if (e.key === 'F3' && e.shiftKey) {
                    e.preventDefault();
                    navigateHighlight(-1);
                } else if (e.key === 'g' && e.ctrlKey) {
                    e.preventDefault();
                    document.getElementById('goto-line')?.focus();
                } else if (e.key === 'Escape') {
                    const activeEl = document.activeElement;
                    if (activeEl?.tagName === 'INPUT') {
                        activeEl.blur();
                    }
                }
            });
        }

        function debounce(func, wait) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }

        // 필터 입력 스타일 업데이트 (체크박스 상태에 따라)
        function updateFilterInputStyles() {
            const filterPairs = [
                ['word-find', 'word-find-enabled'],
                ['word-remove', 'word-remove-enabled'],
                ['class-show', 'class-show-enabled'],
                ['class-remove', 'class-remove-enabled'],
                ['highlight-keyword', 'highlight-enabled']
            ];

            filterPairs.forEach(([inputId, checkboxId]) => {
                const input = document.getElementById(inputId);
                const checkbox = document.getElementById(checkboxId);
                if (input && checkbox) {
                    if (checkbox.checked) {
                        input.classList.remove('filter-disabled');
                    } else {
                        input.classList.add('filter-disabled');
                    }
                }
            });
        }

        // 글로벌 에러 핸들러
        window.onerror = function(msg, url, line, col, error) {
            console.error('[GLOBAL ERROR]', msg, 'at', line, ':', col);
            setStatus('JS 오류: ' + msg);
            return false;
        };

        // 테스트용 전역 함수 노출
        window.applyFilter = applyFilter;
        window.renderLogs = renderLogs;
        window.addLogEntry = addLogEntry;

        window.onload = function() {
            // 배열 참조 재설정 (페이지 로드 후)
            window.allLogs = allLogs;
            window.filteredLogs = filteredLogs;

            loadTheme();
            applySettings();  // tail 설정 등 로드
            updatePresetDropdown();
            setupEventListeners();
            loadContexts();

            // 초기 메시지 표시 (풀 초기화 전)
            const tbody = document.querySelector('.log-table tbody');
            tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5 text-gray-500 dark:text-gray-400">Pod를 선택하고 연결하세요</td></tr>';
        };
    </script>

</body>
